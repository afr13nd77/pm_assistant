# Pipeline Agent Configuration
version: 1

defaults:
  model: "claude-sonnet-4-6"
  max_tokens: 4096
  timeout_seconds: 120

agents:
  analyst:
    model: "claude-sonnet-4-6"
    max_tokens: 4096
    timeout_seconds: 120
    prompt_file: "prompts/analyst.txt"
    vault_context:
      enabled: true
      max_entries: 10

  pm:
    model: "claude-sonnet-4-6"
    max_tokens: 8192
    timeout_seconds: 180
    prompt_file: "prompts/pm.txt"

  decomposer:
    model: "claude-sonnet-4-6"
    max_tokens: 16384
    timeout_seconds: 180
    prompt_file: "prompts/decomposer.txt"

notification:
  enabled: true
  on_complete: true
  on_failure: true
