<!DOCTYPE html>
<html lang="ru" class="theme-matrix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Board -- Settings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-matrix.css" id="theme-css">
  <script>
  (function() {
    try {
      var t = localStorage.getItem('pm_theme');
      if (t === 'light') {
        document.documentElement.className = 'theme-light';
        document.getElementById('theme-css').href = 'style-light.css';
      }
    } catch(e) {}
  })();
  </script>
  <style>
    .settings-section { margin-bottom: 32px; }
    .settings-section-title { font-size: 11px; letter-spacing: 0.15em; color: var(--cyan); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .field-group { margin-bottom: 16px; }
    .field-label { font-size: 9px; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px; }
    .field-input {
      width: 100%; max-width: 400px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-body); font-family: var(--font); font-size: 11px; padding: 6px 8px; outline: none;
    }
    .field-input:focus { border-color: var(--cyan); }
    .field-select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-body);
      font-family: var(--font); font-size: 11px; padding: 6px 8px; outline: none;
    }
    .field-textarea {
      width: 100%; min-height: 200px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-body); font-family: var(--font); font-size: 10px; padding: 8px;
      resize: vertical; outline: none; line-height: 1.5;
    }
    .field-textarea:focus { border-color: var(--cyan); }
    .field-note { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
    .save-bar { display: flex; gap: 8px; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .save-status { font-size: 10px; }
    .toggle-row {
      display: flex;
      gap: 0;
      margin-top: 4px;
    }
    .toggle-btn {
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 5px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-btn:first-child {
      border-right: none;
    }
    .toggle-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-body);
    }
    .toggle-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-bg);
    }
    .toggle-btn-triple:first-child { border-right: none; }
    .toggle-btn-triple:nth-child(2) { border-right: none; }
    .ollama-fields { margin-top: 12px; }
    .ollama-fields .field-group { margin-bottom: 10px; }
    .ollama-test-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .ollama-status { font-size: 10px; letter-spacing: 0.05em; }
    .ollama-status.ok { color: #4caf50; }
    .ollama-status.err { color: #f44336; }
    .llm-info-panel {
      margin-top: 12px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      font-size: 10px;
      line-height: 1.7;
      color: var(--text-muted);
      opacity: 0.75;
    }
    .llm-info-panel strong { color: var(--text-body); font-weight: 500; }

    /* Provider config blocks */
    .provider-config-block {
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid var(--border);
      border-left: 2px solid var(--cyan);
    }
    .provider-config-header {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--cyan);
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Fallback group cards */
    .fallback-group-card {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--border);
    }
    .fallback-group-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .fallback-group-name {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--cyan);
      font-weight: 500;
    }
    .fallback-group-ops {
      font-size: 9px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Fallback chain items */
    .fallback-chain {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fallback-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: grab;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .fallback-item:hover {
      border-color: var(--border-hover);
    }
    .fallback-item--solo {
      cursor: default;
      opacity: 0.7;
    }
    .fallback-item-handle {
      color: var(--text-muted);
      font-size: 14px;
      cursor: grab;
      width: 16px;
      text-align: center;
    }
    .fallback-item-index {
      font-size: 9px;
      color: var(--text-muted);
      width: 14px;
      text-align: center;
    }
    .fallback-item-name {
      font-size: 11px;
      color: var(--text-body);
      flex: 1;
      letter-spacing: 0.05em;
    }
    .fallback-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .fallback-item-remove:hover {
      color: #f44336;
    }

    /* Drag-and-drop visual feedback */
    .fallback-item.drag-over-above {
      border-top: 2px solid var(--cyan);
      margin-top: -1px;
    }
    .fallback-item.drag-over-below {
      border-bottom: 2px solid var(--cyan);
      margin-bottom: -1px;
    }

    /* Add provider buttons */
    .fallback-add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .cmd-btn-small {
      font-family: var(--font);
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }
    .cmd-btn-small:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      border-style: solid;
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <app-sidebar active="settings" @search="searchOpen = true"></app-sidebar>
    <search-overlay :open="searchOpen" @close="searchOpen = false"></search-overlay>
    <main class="page-content" style="position: relative; overflow: hidden;">
      <div class="scan-line"></div>
      <div class="text-page-title">SETTINGS</div>

      <div v-if="loading" class="loading">LOADING...</div>
      <div v-if="error" class="empty-state">{{ error }}</div>

      <template v-if="!loading">
        <!-- Refresh section -->
        <div class="settings-section">
          <div class="settings-section-title">// REFRESH</div>
          <div class="field-group">
            <div class="field-label">DATA_REFRESH_MODE</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: refreshMode === 'auto' }"
                      @click="setRefreshMode('auto')">AUTO</button>
              <button class="toggle-btn" :class="{ active: refreshMode === 'manual' }"
                      @click="setRefreshMode('manual')">MANUAL</button>
            </div>
            <div class="field-note">AUTO: board updates every 30s, roadmap every 60s. MANUAL: refresh only on click.</div>
          </div>
        </div>

        <!-- Theme section -->
        <div class="settings-section">
          <div class="settings-section-title">// THEME</div>
          <div class="field-group">
            <div class="field-label">UI_THEME</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: currentTheme === 'matrix' }"
                      @click="setTheme('matrix')">MATRIX</button>
              <button class="toggle-btn" :class="{ active: currentTheme === 'light' }"
                      @click="setTheme('light')">LIGHT</button>
            </div>
            <div class="field-note">MATRIX: dark cyberpunk with neon glow. LIGHT: warm cream with minimal shadows.</div>
          </div>
        </div>

        <!-- Capture Terminal mode section -->
        <div class="settings-section">
          <div class="settings-section-title">// CAPTURE TERMINAL</div>
          <div class="field-group">
            <div class="field-label">CAPTURE_TERMINAL_MODE</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: captureMode === 'simple' }"
                      @click="setCaptureMode('simple')">SIMPLE</button>
              <button class="toggle-btn" :class="{ active: captureMode === 'extended' }"
                      @click="setCaptureMode('extended')">EXTENDED</button>
            </div>
            <div class="field-note">SIMPLE: chat-style terminal. EXTENDED: card-based UI with live preview and Jira Import.</div>
          </div>
        </div>

        <!-- LLM Providers section (replaces LLM Provider + Transcription Provider) -->
        <div class="settings-section">
          <div class="settings-section-title">// LLM PROVIDERS</div>

          <!-- Ollama connection settings -->
          <div class="provider-config-block">
            <div class="provider-config-header">OLLAMA</div>
            <div class="field-group">
              <div class="field-label">OLLAMA_URL</div>
              <input class="field-input" v-model="ollamaUrl"
                     placeholder="http://192.168.0.21:11434"
                     @change="saveProviderSettings">
            </div>
            <div class="field-group">
              <div class="field-label">OLLAMA_MODEL</div>
              <input class="field-input" v-model="ollamaModel"
                     placeholder="qwen3.5:latest" style="width: 250px;"
                     @change="saveProviderSettings">
            </div>
            <div class="ollama-test-row">
              <button class="cmd-btn cmd-btn-cyan" :disabled="ollamaTesting"
                      @click="testOllamaConnection()">
                {{ ollamaTesting ? '...' : 'TEST CONNECTION' }}
              </button>
              <span v-if="ollamaStatus && ollamaStatus.status === 'ok'" class="ollama-status ok">
                Connected &mdash; Ollama v{{ ollamaStatus.ollama_version }}
              </span>
              <span v-if="ollamaStatus && ollamaStatus.status === 'error'" class="ollama-status err">
                {{ ollamaStatus.detail }}
              </span>
            </div>
          </div>

          <!-- OpenRouter connection settings -->
          <div class="provider-config-block">
            <div class="provider-config-header">OPENROUTER</div>
            <div class="field-group">
              <div class="field-label">OPENROUTER_MODEL</div>
              <select class="field-select" v-model="openrouterModel"
                      @change="saveProviderSettings" style="width: 300px;">
                <option v-for="m in openrouterModels" :key="m.id" :value="m.id">
                  {{ m.name }}
                </option>
              </select>
            </div>
            <div class="field-group">
              <div class="field-label">API_KEY_STATUS</div>
              <div style="font-size: 11px; margin-top: 4px;">
                <span v-if="openrouterKeyStatus && openrouterKeyStatus.has_key"
                      style="color: #4caf50;">OPENROUTER_API_KEY is set in .env</span>
                <span v-else style="color: #f44336;">OPENROUTER_API_KEY is NOT set</span>
              </div>
            </div>
            <div class="ollama-test-row">
              <button class="cmd-btn cmd-btn-cyan" :disabled="openrouterTesting"
                      @click="testOpenRouterConnection()">
                {{ openrouterTesting ? '...' : 'TEST CONNECTION' }}
              </button>
              <span v-if="openrouterStatus && openrouterStatus.status === 'ok'"
                    class="ollama-status ok">
                Connected &mdash; {{ openrouterStatus.model_name }} available
              </span>
              <span v-if="openrouterStatus && openrouterStatus.status === 'error'"
                    class="ollama-status err">
                {{ openrouterStatus.detail }}
              </span>
            </div>
          </div>
        </div>

        <!-- Operation Groups with fallback chains -->
        <div class="settings-section">
          <div class="settings-section-title">// FALLBACK CHAINS</div>

          <div v-for="group in operationGroups" :key="group.key"
               class="fallback-group-card">
            <div class="fallback-group-header">
              <span class="fallback-group-name">{{ group.name }}</span>
              <span class="fallback-group-ops">{{ group.operations.join(', ') }}</span>
            </div>

            <!-- Sortable fallback chain -->
            <div class="fallback-chain"
                 @dragover.prevent="handleDragOver($event, group.key)"
                 @drop="handleDrop($event, group.key)">

              <div v-for="(provider, idx) in group.chain" :key="provider + '-' + idx"
                   class="fallback-item"
                   :class="{
                     'fallback-item--solo': group.chain.length === 1,
                     'drag-over-above': dragState.group === group.key && dragState.targetIdx === idx && dragState.position === 'above',
                     'drag-over-below': dragState.group === group.key && dragState.targetIdx === idx && dragState.position === 'below'
                   }"
                   :draggable="group.chain.length > 1 ? 'true' : 'false'"
                   @dragstart="handleDragStart($event, group.key, idx)"
                   @dragend="handleDragEnd">
                <span class="fallback-item-handle"
                      v-if="group.chain.length > 1">::</span>
                <span class="fallback-item-index">{{ idx + 1 }}</span>
                <span class="fallback-item-name">{{ providerDisplayName(provider) }}</span>
                <button class="fallback-item-remove"
                        v-if="group.chain.length > 1"
                        @click="removeFromChain(group.key, idx)"
                        title="Remove">&times;</button>
              </div>
            </div>

            <!-- Available providers to add -->
            <div class="fallback-add-row"
                 v-if="availableProviders(group.key).length > 0">
              <button v-for="p in availableProviders(group.key)" :key="p"
                      class="cmd-btn cmd-btn-small"
                      @click="addToChain(group.key, p)">
                + {{ providerDisplayName(p) }}
              </button>
            </div>
          </div>
        </div>

        <!-- Vault section -->
        <div class="settings-section">
          <div class="settings-section-title">// VAULT</div>
          <div class="field-group">
            <div class="field-label">VAULT_PATH</div>
            <input class="field-input" v-model="settings.vault_path" disabled>
            <div class="field-note">Requires container restart to change</div>
          </div>
          <div class="field-group">
            <div class="field-label">TRANSCRIPTS_PATH</div>
            <input class="field-input" v-model="settings.transcripts_path" disabled>
            <div class="field-note">Requires container restart to change</div>
          </div>
        </div>

        <!-- Email fetch section -->
        <div class="settings-section">
          <div class="settings-section-title">// EMAIL_FETCH</div>
          <div class="field-group">
            <div class="field-label">FETCH_MEETINGS</div>
            <div class="field-group" style="display: flex; align-items: center; gap: 12px;">
              <cmd-button label="FETCH NOW" color="cyan" :loading="fetchingMeetings"
                          @click="runFetchMeetings"></cmd-button>
              <span v-if="fetchMeetingsStatus" class="save-status"
                    :class="fetchMeetingsStatus.includes('ERROR') ? 'text-magenta' : 'text-green'">
                {{ fetchMeetingsStatus }}
              </span>
            </div>
            <div class="field-note">Проверить почту на новые транскрибации встреч</div>
          </div>
        </div>

        <!-- Jira sync section -->
        <div class="settings-section">
          <div class="settings-section-title">// JIRA_SYNC</div>
          <div class="field-group">
            <div class="field-label">LAST_SYNC</div>
            <div style="font-size: 12px; color: var(--text-body); margin-bottom: 8px;">
              {{ lastSyncTime || 'Never synced' }}
            </div>
          </div>
          <div class="field-group" style="display: flex; align-items: center; gap: 12px;">
            <cmd-button label="SYNC NOW" color="cyan" :loading="syncing"
                        @click="triggerSync"></cmd-button>
            <span v-if="syncResult" class="save-status"
                  :class="syncOk ? 'text-green' : 'text-magenta'">
              {{ syncResult }}
            </span>
          </div>
          <div class="field-group" style="margin-top: 12px;">
            <div class="field-label">TELEGRAM_NOTIFICATIONS</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: jiraSyncNotify }"
                      @click="setJiraSyncNotify(true)">ON</button>
              <button class="toggle-btn" :class="{ active: !jiraSyncNotify }"
                      @click="setJiraSyncNotify(false)">OFF</button>
            </div>
            <div class="field-note">ON: send Telegram summary after every Jira sync. OFF: sync runs silently, results in logs only.</div>
          </div>
        </div>

        <!-- Report section -->
        <div class="settings-section">
          <div class="settings-section-title">// REPORT</div>
          <div class="field-group">
            <div class="field-label">REPORT_TIME</div>
            <input class="field-input" v-model="settings.report_time" style="width: 120px;">
          </div>
          <div class="field-group">
            <div class="field-label">REPORT_DAY</div>
            <select class="field-select" v-model="settings.report_day">
              <option value="mon">Monday</option>
              <option value="tue">Tuesday</option>
              <option value="wed">Wednesday</option>
              <option value="thu">Thursday</option>
              <option value="fri">Friday</option>
            </select>
          </div>
        </div>

        <!-- Roadmap labels -->
        <div class="settings-section">
          <div class="settings-section-title">// ROADMAP LABELS</div>
          <div style="display: flex; gap: 16px;">
            <div class="field-group">
              <div class="field-label">NOW</div>
              <input class="field-input" v-model="settings.roadmap_now_label" style="width: 150px;">
            </div>
            <div class="field-group">
              <div class="field-label">NEXT</div>
              <input class="field-input" v-model="settings.roadmap_next_label" style="width: 150px;">
            </div>
            <div class="field-group">
              <div class="field-label">LATER</div>
              <input class="field-input" v-model="settings.roadmap_later_label" style="width: 150px;">
            </div>
          </div>
        </div>

        <!-- Prompts section -->
        <div class="settings-section">
          <div class="settings-section-title">// PROMPTS</div>
          <div v-for="(content, name) in settings.prompts" :key="name" class="field-group">
            <div class="field-label">{{ name.toUpperCase() }}.TXT</div>
            <textarea class="field-textarea" v-model="settings.prompts[name]"></textarea>
          </div>
        </div>

        <!-- Save bar -->
        <div class="save-bar">
          <cmd-button label="SAVE" color="cyan" :loading="saving" @click="saveSettings"></cmd-button>
          <span v-if="saveStatus" class="save-status" :class="saveOk ? 'text-green' : 'text-magenta'">{{ saveStatus }}</span>
        </div>
      </template>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script>
  console.log('[settings] initializing settings page');

  var { createApp, ref, reactive, onMounted } = Vue;

  var app = createApp({
    setup: function() {
      var settings = reactive({
        vault_path: '',
        transcripts_path: '',
        report_time: '09:00',
        report_day: 'mon',
        roadmap_now_label: '',
        roadmap_next_label: '',
        roadmap_later_label: '',
        prompts: {},
      });
      var loading = ref(true);
      var error = ref(null);
      var saving = ref(false);
      var saveStatus = ref('');
      var saveOk = ref(false);
      var refreshMode = ref('auto');
      var refreshSaving = ref(false);
      var currentTheme = ref('matrix');
      var syncing = ref(false);
      var lastSyncTime = ref(null);
      var syncResult = ref('');
      var syncOk = ref(false);
      var llmProvider = ref('claude');
      var ollamaUrl = ref('');
      var ollamaModel = ref('qwen3.5:latest');
      var ollamaStatus = ref(null);
      var ollamaTesting = ref(false);
      var llmSaving = ref(false);
      var jiraSyncNotify = ref(true);
      var captureMode = ref('simple');
      var transcriptionProvider = ref('default');
      var openrouterModel = ref('qwen/qwen3-32b');
      var openrouterModels = ref([]);
      var openrouterKeyStatus = ref(null);
      var openrouterStatus = ref(null);
      var openrouterTesting = ref(false);
      var searchOpen = ref(false);
      var fetchingMeetings = ref(false);
      var fetchMeetingsStatus = ref('');

      var operationGroups = ref([
        {
          key: 'capture',
          name: 'CAPTURE',
          operations: ['idea', 'daily', 'jira_ticket'],
          chain: ['claude']
        },
        {
          key: 'transcription',
          name: 'TRANSCRIPTION',
          operations: ['meeting', 'meeting_protocol'],
          chain: ['claude']
        },
        {
          key: 'analysis',
          name: 'ANALYSIS',
          operations: ['enrich', 'synthesize', 'report', 'pipeline'],
          chain: ['claude']
        }
      ]);

      var dragState = ref({
        group: null,
        sourceIdx: null,
        targetIdx: null,
        position: null
      });

      var allProviders = ['claude', 'ollama', 'openrouter'];

      function buildPrefsPayload() {
        var captureChain = (findGroup('capture') || {}).chain || ['claude'];
        var transcriptionChain = (findGroup('transcription') || {}).chain || ['claude'];
        var analysisChain = (findGroup('analysis') || {}).chain || ['claude'];

        return {
          refresh_mode: refreshMode.value,
          theme: currentTheme.value,
          llm_provider: llmProvider.value,
          ollama_url: ollamaUrl.value,
          ollama_model: ollamaModel.value,
          jira_sync_notify: jiraSyncNotify.value,
          capture_mode: captureMode.value,
          transcription_provider: transcriptionProvider.value,
          openrouter_model: openrouterModel.value,
          capture_fallback: captureChain,
          transcription_fallback: transcriptionChain,
          analysis_fallback: analysisChain
        };
      }

      function loadSettings() {
        console.log('[settings] loading');
        loading.value = true;
        error.value = null;
        apiFetch('/settings').then(function(data) {
          Object.assign(settings, data);
          console.log('[settings] loaded, prompts:', Object.keys(settings.prompts));
          loading.value = false;
        }).catch(function(e) {
          console.error('[settings] load error', e);
          error.value = 'Failed to load settings: ' + e.message;
          loading.value = false;
        });
      }

      function saveSettings() {
        console.log('[settings] saving');
        saving.value = true;
        saveStatus.value = '';
        apiFetch('/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings),
        }).then(function(res) {
          saveOk.value = true;
          saveStatus.value = 'SAVED (' + res.saved_prompts + ' prompts)';
          console.log('[settings] saved', res);
          setTimeout(function() { saveStatus.value = ''; }, 3000);
          saving.value = false;
        }).catch(function(e) {
          console.error('[settings] save error', e);
          saveOk.value = false;
          saveStatus.value = 'ERROR: ' + e.message;
          saving.value = false;
        });
      }

      function setRefreshMode(mode) {
        console.log('[settings] setRefreshMode:', mode);
        refreshSaving.value = true;
        refreshMode.value = mode;
        api.saveUserPrefs(buildPrefsPayload()).then(function(res) {
          console.log('[settings] refresh mode saved:', res.refresh_mode);
          refreshSaving.value = false;
        }).catch(function(err) {
          console.error('[settings] saveUserPrefs error:', err.message);
          refreshSaving.value = false;
        });
      }

      function setTheme(theme) {
        console.log('[settings] setTheme:', theme);
        currentTheme.value = theme;
        applyPageTheme(theme);
        api.saveUserPrefs(buildPrefsPayload()).then(function(res) {
          console.log('[settings] theme saved:', res.theme);
        }).catch(function(err) {
          console.error('[settings] saveUserPrefs (theme) error:', err.message);
        });
        try {
          localStorage.setItem('pm_theme', theme);
        } catch (e) { /* ignore */ }
      }

      function loadSyncStatus() {
        console.log('[settings] loading sync status');
        api.jiraSyncStatus().then(function(data) {
          if (data.last_sync) {
            try {
              var dt = new Date(data.last_sync);
              var dd = String(dt.getDate()).padStart(2, '0');
              var mm = String(dt.getMonth() + 1).padStart(2, '0');
              var yyyy = dt.getFullYear();
              var hh = String(dt.getHours()).padStart(2, '0');
              var min = String(dt.getMinutes()).padStart(2, '0');
              lastSyncTime.value = dd + '.' + mm + '.' + yyyy + ' ' + hh + ':' + min;
            } catch (e) {
              lastSyncTime.value = data.last_sync;
            }
          } else {
            lastSyncTime.value = null;
          }
          console.log('[settings] sync status loaded, last_sync:', lastSyncTime.value);
        }).catch(function(e) {
          console.error('[settings] sync status load error:', e.message);
        });
      }

      function triggerSync() {
        console.log('[settings] triggerSync: starting');
        syncing.value = true;
        syncResult.value = '';
        api.jiraSync().then(function(data) {
          console.log('[settings] triggerSync: success', data);
          syncOk.value = true;
          syncResult.value = 'OK: ' + (data.new || 0) + ' new, '
            + (data.updated || 0) + ' updated, '
            + (data.closed || 0) + ' closed';
          syncing.value = false;
          loadSyncStatus();
          setTimeout(function() { syncResult.value = ''; }, 10000);
        }).catch(function(e) {
          console.error('[settings] triggerSync: error', e.message);
          syncOk.value = false;
          syncResult.value = 'ERROR: ' + e.message;
          syncing.value = false;
        });
      }

      async function runFetchMeetings() {
        fetchingMeetings.value = true;
        fetchMeetingsStatus.value = '';
        try {
          var data = await api.fetchMeetings();
          if (data.status === 'ok') {
            fetchMeetingsStatus.value = 'OK: ' + data.newly_processed + ' new, ' + data.already_processed + ' skipped';
          } else {
            fetchMeetingsStatus.value = 'ERROR: ' + (data.message || 'unknown');
          }
        } catch (e) {
          fetchMeetingsStatus.value = 'ERROR: ' + (e.message || e);
        }
        fetchingMeetings.value = false;
        setTimeout(function() { fetchMeetingsStatus.value = ''; }, 10000);
      }

      function setJiraSyncNotify(value) {
        console.log('[settings] setJiraSyncNotify:', value);
        jiraSyncNotify.value = value;
        api.saveUserPrefs(buildPrefsPayload()).then(function(res) {
          console.log('[settings] jira_sync_notify saved:', res.jira_sync_notify);
        }).catch(function(err) {
          console.error('[settings] saveUserPrefs (jira_sync_notify) error:', err.message);
          jiraSyncNotify.value = !value;
        });
      }

      function setCaptureMode(mode) {
        console.log('[settings] setCaptureMode:', mode);
        captureMode.value = mode;
        api.saveUserPrefs(buildPrefsPayload());
        try { localStorage.setItem('pm_capture_mode', mode); } catch(e) {}
      }

      function providerDisplayName(provider) {
        var names = {
          'claude': 'Claude API',
          'ollama': 'Ollama',
          'openrouter': 'OpenRouter'
        };
        return names[provider] || provider;
      }

      function findGroup(key) {
        return operationGroups.value.find(function(g) { return g.key === key; });
      }

      function handleDragStart(event, groupKey, idx) {
        console.log('[settings] dragStart:', groupKey, idx);
        dragState.value = { group: groupKey, sourceIdx: idx, targetIdx: null, position: null };
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', groupKey + ':' + idx);
      }

      function handleDragOver(event, groupKey) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';

        var target = event.target.closest('.fallback-item');
        if (!target) return;

        var rect = target.getBoundingClientRect();
        var midY = rect.top + rect.height / 2;
        var position = event.clientY < midY ? 'above' : 'below';

        var items = target.parentElement.querySelectorAll('.fallback-item');
        var targetIdx = Array.from(items).indexOf(target);

        dragState.value.targetIdx = targetIdx;
        dragState.value.position = position;
      }

      function handleDrop(event, groupKey) {
        event.preventDefault();
        console.log('[settings] drop:', groupKey, dragState.value);

        var state = dragState.value;
        if (state.group !== groupKey || state.sourceIdx === null || state.targetIdx === null) {
          handleDragEnd();
          return;
        }

        var group = findGroup(groupKey);
        if (!group) {
          handleDragEnd();
          return;
        }

        var chain = group.chain;
        var sourceIdx = state.sourceIdx;
        var targetIdx = state.targetIdx;

        var newIdx = state.position === 'below' ? targetIdx + 1 : targetIdx;

        if (newIdx === sourceIdx || newIdx === sourceIdx + 1) {
          handleDragEnd();
          return;
        }

        var item = chain.splice(sourceIdx, 1)[0];
        if (newIdx > sourceIdx) newIdx--;
        chain.splice(newIdx, 0, item);

        console.log('[settings] chain reordered:', groupKey, chain);
        handleDragEnd();
        saveProviderSettings();
      }

      function handleDragEnd() {
        dragState.value = { group: null, sourceIdx: null, targetIdx: null, position: null };
      }

      function removeFromChain(groupKey, idx) {
        var group = findGroup(groupKey);
        if (!group) return;
        if (group.chain.length <= 1) {
          console.log('[settings] cannot remove last provider from', groupKey);
          return;
        }
        var removed = group.chain.splice(idx, 1)[0];
        console.log('[settings] removed', removed, 'from', groupKey);
        saveProviderSettings();
      }

      function addToChain(groupKey, provider) {
        var group = findGroup(groupKey);
        if (!group) return;
        if (group.chain.indexOf(provider) !== -1) return;
        group.chain.push(provider);
        console.log('[settings] added', provider, 'to', groupKey);
        saveProviderSettings();
      }

      function availableProviders(groupKey) {
        var group = findGroup(groupKey);
        if (!group) return [];
        return allProviders.filter(function(p) {
          return group.chain.indexOf(p) === -1;
        });
      }

      function saveProviderSettings() {
        console.log('[settings] saveProviderSettings');
        llmSaving.value = true;
        api.saveUserPrefs(buildPrefsPayload()).then(function() {
          console.log('[settings] provider settings saved');
          llmSaving.value = false;
        }).catch(function(err) {
          console.error('[settings] failed to save provider settings:', err.message);
          llmSaving.value = false;
        });
      }

      function testOllamaConnection() {
        console.log('[settings] testOllamaConnection called, url:', ollamaUrl.value);
        if (!ollamaUrl.value) {
          ollamaStatus.value = { status: 'error', detail: 'Enter Ollama URL first' };
          return;
        }
        ollamaTesting.value = true;
        ollamaStatus.value = null;
        api.testOllama(ollamaUrl.value).then(function(data) {
          console.log('[settings] testOllama success:', data);
          ollamaStatus.value = data;
          ollamaTesting.value = false;
        }).catch(function(err) {
          console.error('[settings] testOllama error:', err.message);
          ollamaStatus.value = { status: 'error', detail: err.message || 'Unknown error' };
          ollamaTesting.value = false;
        });
      }

      function saveOllamaSettings() {
        console.log('[settings] saveOllamaSettings');
        saveProviderSettings();
        if (ollamaUrl.value) {
          testOllamaConnection();
        }
      }

      function setTranscriptionProvider(provider) {
        console.log('[settings] setTranscriptionProvider:', provider);
        transcriptionProvider.value = provider;
        saveProviderSettings();
        if (provider === 'openrouter') {
          loadOpenRouterKeyStatus();
          loadOpenRouterModels();
        }
      }

      function loadOpenRouterModels() {
        console.log('[settings] loadOpenRouterModels');
        api.openrouterModels().then(function(data) {
          openrouterModels.value = data.models || [];
          console.log('[settings] loaded', openrouterModels.value.length, 'OpenRouter models');
        }).catch(function(err) {
          console.error('[settings] loadOpenRouterModels error:', err.message);
        });
      }

      function loadOpenRouterKeyStatus() {
        console.log('[settings] loadOpenRouterKeyStatus');
        api.openrouterKeyStatus().then(function(data) {
          openrouterKeyStatus.value = data;
          console.log('[settings] openrouter key status:', data.has_key);
        }).catch(function(err) {
          console.error('[settings] loadOpenRouterKeyStatus error:', err.message);
        });
      }

      function testOpenRouterConnection() {
        console.log('[settings] testOpenRouterConnection, model:', openrouterModel.value);
        openrouterTesting.value = true;
        openrouterStatus.value = null;
        api.testOpenRouter(openrouterModel.value).then(function(data) {
          console.log('[settings] testOpenRouter result:', data);
          openrouterStatus.value = data;
          openrouterTesting.value = false;
        }).catch(function(err) {
          console.error('[settings] testOpenRouter error:', err.message);
          openrouterStatus.value = { status: 'error', detail: err.message || 'Unknown error' };
          openrouterTesting.value = false;
        });
      }

      function saveOpenRouterModel() {
        console.log('[settings] saveOpenRouterModel:', openrouterModel.value);
        saveProviderSettings();
      }

      onMounted(function() {
        console.log('[settings] component mounted, loading settings');
        loadSettings();
        loadSyncStatus();
        applyPageTheme();
        api.getUserPrefs().then(function(prefs) {
          refreshMode.value = prefs.refresh_mode || 'auto';
          currentTheme.value = prefs.theme || 'matrix';
          llmProvider.value = prefs.llm_provider || 'claude';
          ollamaUrl.value = prefs.ollama_url || '';
          ollamaModel.value = prefs.ollama_model || 'qwen3.5:latest';
          jiraSyncNotify.value = prefs.jira_sync_notify !== false;
          captureMode.value = prefs.capture_mode || 'simple';
          try { localStorage.setItem('pm_capture_mode', captureMode.value); } catch(e) {}
          transcriptionProvider.value = prefs.transcription_provider || 'default';
          openrouterModel.value = prefs.openrouter_model || 'qwen/qwen3-32b';
          // Load fallback chains
          if (prefs.capture_fallback && Array.isArray(prefs.capture_fallback)) {
            findGroup('capture').chain = prefs.capture_fallback;
          }
          if (prefs.transcription_fallback && Array.isArray(prefs.transcription_fallback)) {
            findGroup('transcription').chain = prefs.transcription_fallback;
          }
          if (prefs.analysis_fallback && Array.isArray(prefs.analysis_fallback)) {
            findGroup('analysis').chain = prefs.analysis_fallback;
          }

          console.log('[settings] prefs loaded: refresh=%s theme=%s llm=%s capture=%s transcription=%s', refreshMode.value, currentTheme.value, llmProvider.value, captureMode.value, transcriptionProvider.value);
          applyPageTheme(currentTheme.value);
          if (ollamaUrl.value) {
            testOllamaConnection();
          }
          // OpenRouter: load models and key always (provider may be in any group)
          loadOpenRouterKeyStatus();
          loadOpenRouterModels();
        }).catch(function(err) {
          console.error('[settings] getUserPrefs error:', err.message);
        });
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            searchOpen.value = true;
          }
        });
      });

      return {
        searchOpen: searchOpen,
        settings: settings,
        loading: loading,
        error: error,
        saving: saving,
        saveStatus: saveStatus,
        saveOk: saveOk,
        loadSettings: loadSettings,
        saveSettings: saveSettings,
        refreshMode: refreshMode,
        refreshSaving: refreshSaving,
        setRefreshMode: setRefreshMode,
        currentTheme: currentTheme,
        setTheme: setTheme,
        syncing: syncing,
        lastSyncTime: lastSyncTime,
        syncResult: syncResult,
        syncOk: syncOk,
        triggerSync: triggerSync,
        llmProvider: llmProvider,
        ollamaUrl: ollamaUrl,
        ollamaModel: ollamaModel,
        ollamaStatus: ollamaStatus,
        ollamaTesting: ollamaTesting,
        llmSaving: llmSaving,
        testOllamaConnection: testOllamaConnection,
        saveOllamaSettings: saveOllamaSettings,
        jiraSyncNotify: jiraSyncNotify,
        setJiraSyncNotify: setJiraSyncNotify,
        captureMode: captureMode,
        setCaptureMode: setCaptureMode,
        buildPrefsPayload: buildPrefsPayload,
        transcriptionProvider: transcriptionProvider,
        openrouterModel: openrouterModel,
        openrouterModels: openrouterModels,
        openrouterKeyStatus: openrouterKeyStatus,
        openrouterStatus: openrouterStatus,
        openrouterTesting: openrouterTesting,
        setTranscriptionProvider: setTranscriptionProvider,
        loadOpenRouterModels: loadOpenRouterModels,
        loadOpenRouterKeyStatus: loadOpenRouterKeyStatus,
        testOpenRouterConnection: testOpenRouterConnection,
        saveOpenRouterModel: saveOpenRouterModel,
        operationGroups: operationGroups,
        dragState: dragState,
        providerDisplayName: providerDisplayName,
        findGroup: findGroup,
        handleDragStart: handleDragStart,
        handleDragOver: handleDragOver,
        handleDrop: handleDrop,
        handleDragEnd: handleDragEnd,
        removeFromChain: removeFromChain,
        addToChain: addToChain,
        availableProviders: availableProviders,
        saveProviderSettings: saveProviderSettings,
        fetchingMeetings: fetchingMeetings,
        fetchMeetingsStatus: fetchMeetingsStatus,
        runFetchMeetings: runFetchMeetings,
      };
    }
  });

  registerComponents(app);
  applyPageTheme().then(function() {
    app.mount('#app');
    console.log('[settings] app mounted');
  });
  </script>
</body>
</html>
