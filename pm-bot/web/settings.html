<!DOCTYPE html>
<html lang="ru" class="theme-matrix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Board -- Settings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-matrix.css" id="theme-css">
  <script>
  (function() {
    try {
      var t = localStorage.getItem('pm_theme');
      if (t === 'light') {
        document.documentElement.className = 'theme-light';
        document.getElementById('theme-css').href = 'style-light.css';
      }
    } catch(e) {}
  })();
  </script>
  <style>
    .settings-section { margin-bottom: 32px; }
    .settings-section-title { font-size: 11px; letter-spacing: 0.15em; color: var(--cyan); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .field-group { margin-bottom: 16px; }
    .field-label { font-size: 9px; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px; }
    .field-input {
      width: 100%; max-width: 400px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-body); font-family: var(--font); font-size: 11px; padding: 6px 8px; outline: none;
    }
    .field-input:focus { border-color: var(--cyan); }
    .field-select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-body);
      font-family: var(--font); font-size: 11px; padding: 6px 8px; outline: none;
    }
    .field-textarea {
      width: 100%; min-height: 200px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-body); font-family: var(--font); font-size: 10px; padding: 8px;
      resize: vertical; outline: none; line-height: 1.5;
    }
    .field-textarea:focus { border-color: var(--cyan); }
    .bc-textarea {
      width: 100%; min-height: 120px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-body); font-family: var(--font); font-size: 13px; padding: 12px;
      resize: vertical; outline: none; line-height: 1.5; box-sizing: border-box; border-radius: 4px;
    }
    .bc-textarea:focus { border-color: var(--cyan); }
    .bc-textarea::placeholder { color: var(--text-muted); }
    .field-note { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
    .save-bar { display: flex; gap: 8px; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .save-status { font-size: 10px; }
    .toggle-row {
      display: flex;
      gap: 0;
      margin-top: 4px;
    }
    .toggle-btn {
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 5px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-btn:first-child {
      border-right: none;
    }
    .toggle-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-body);
    }
    .toggle-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-bg);
    }
    .toggle-btn-triple:first-child { border-right: none; }
    .toggle-btn-triple:nth-child(2) { border-right: none; }
    .ollama-fields { margin-top: 12px; }
    .ollama-fields .field-group { margin-bottom: 10px; }
    .ollama-test-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .ollama-status { font-size: 10px; letter-spacing: 0.05em; }
    .ollama-status.ok { color: #4caf50; }
    .ollama-status.err { color: #f44336; }
    .llm-info-panel {
      margin-top: 12px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      font-size: 10px;
      line-height: 1.7;
      color: var(--text-muted);
      opacity: 0.75;
    }
    .llm-info-panel strong { color: var(--text-body); font-weight: 500; }

    /* Provider config blocks */
    .provider-config-block {
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid var(--border);
      border-left: 2px solid var(--cyan);
    }
    .provider-config-header {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--cyan);
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Fallback group cards */
    .fallback-group-card {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--border);
    }
    .fallback-group-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .fallback-group-name {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--cyan);
      font-weight: 500;
    }
    .fallback-group-ops {
      font-size: 9px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Fallback chain items */
    .fallback-chain {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fallback-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: grab;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .fallback-item:hover {
      border-color: var(--border-hover);
    }
    .fallback-item--solo {
      cursor: default;
      opacity: 0.7;
    }
    .fallback-item-handle {
      color: var(--text-muted);
      font-size: 14px;
      cursor: grab;
      width: 16px;
      text-align: center;
    }
    .fallback-item-index {
      font-size: 9px;
      color: var(--text-muted);
      width: 14px;
      text-align: center;
    }
    .fallback-item-name {
      font-size: 11px;
      color: var(--text-body);
      flex: 1;
      letter-spacing: 0.05em;
    }
    .fallback-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .fallback-item-remove:hover {
      color: #f44336;
    }

    /* Drag-and-drop visual feedback */
    .fallback-item.drag-over-above {
      border-top: 2px solid var(--cyan);
      margin-top: -1px;
    }
    .fallback-item.drag-over-below {
      border-bottom: 2px solid var(--cyan);
      margin-bottom: -1px;
    }

    /* Add provider buttons */
    .fallback-add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .cmd-btn-small {
      font-family: var(--font);
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }
    .cmd-btn-small:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      border-style: solid;
    }

    /* Inline model selector for OpenRouter chain steps */
    .fallback-item-model-select {
      font-size: 10px;
      padding: 3px 6px;
      max-width: 240px;
      flex: 0 0 auto;
    }
    .fallback-item-fallback-note {
      font-size: 9px;
      color: #f44336;
      white-space: nowrap;
    }

    /* Prompts UI (BL-197) */
    .prompt-group { margin-bottom: 16px; border: 1px solid var(--border); }
    .prompt-group-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      cursor: pointer; font-size: 11px; letter-spacing: 0.1em;
      background: rgba(0, 229, 255, 0.03); transition: background 0.15s;
    }
    .prompt-group-header:hover { background: rgba(0, 229, 255, 0.06); }
    .prompt-group-chevron { color: var(--cyan); font-size: 12px; width: 12px; }
    .prompt-group-name { color: var(--cyan); font-weight: bold; }
    .prompt-group-count { color: var(--text-muted); font-size: 9px; margin-left: auto; }
    .prompt-group-body { padding: 0; }
    .prompt-item { border-top: 1px solid var(--border); }
    .prompt-item-header {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 28px;
      cursor: pointer; font-size: 10px; transition: background 0.15s;
    }
    .prompt-item-header:hover { background: rgba(255, 255, 255, 0.02); }
    .prompt-item-name { color: var(--text-body); letter-spacing: 0.05em; min-width: 140px; }
    .prompt-item-desc { color: var(--text-muted); font-size: 9px; flex: 1; }
    .prompt-item-lines {
      font-size: 8px; color: var(--text-muted); padding: 1px 6px;
      border: 1px solid var(--border); border-radius: 3px;
    }
    .prompt-item-modified {
      font-size: 8px; color: #ff9800; padding: 1px 6px;
      border: 1px solid rgba(255, 152, 0, 0.3); border-radius: 3px;
    }
    .prompt-item-body { padding: 8px 12px 12px 28px; }
    .prompt-editor {
      width: 100%; min-height: 200px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-body); font-family: var(--font); font-size: 10px; padding: 8px;
      resize: vertical; outline: none; line-height: 1.5;
    }
    .prompt-editor:focus { border-color: var(--cyan); }
    .prompt-var-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .prompt-var-badge {
      font-size: 9px; color: var(--cyan); padding: 2px 8px;
      border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 3px;
      background: rgba(0, 229, 255, 0.05); cursor: default;
    }
    .prompt-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .prompt-error { color: #f44336; font-size: 9px; margin-left: 8px; }
    .prompt-error-detail { color: #f44336; font-size: 9px; padding: 8px 12px; }

    /* Vector Store / Embeddings (BL-237) */
    .emb-stats-panel {
      padding: 8px 12px;
      border: 1px solid var(--border);
      font-size: 10px;
      line-height: 1.7;
      color: var(--text-muted);
    }
    .emb-stats-panel strong { color: var(--text-body); font-weight: 500; }
    .emb-chain-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: grab;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .emb-chain-item:hover { border-color: var(--border-hover); }
    .emb-chain-item.drag-over-above { border-top: 2px solid var(--cyan); margin-top: -1px; }
    .emb-chain-item.drag-over-below { border-bottom: 2px solid var(--cyan); margin-bottom: -1px; }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <app-sidebar active="settings" @search="searchOpen = true"></app-sidebar>
    <search-overlay :open="searchOpen" @close="searchOpen = false"></search-overlay>
    <main class="page-content" style="position: relative; overflow: hidden;">
      <div class="scan-line"></div>
      <div class="text-page-title">SETTINGS</div>

      <div v-if="loading" class="loading">LOADING...</div>
      <div v-if="error" class="empty-state">{{ error }}</div>

      <template v-if="!loading">
        <!-- Refresh section -->
        <div class="settings-section">
          <div class="settings-section-title">// REFRESH</div>
          <div class="field-group">
            <div class="field-label">DATA_REFRESH_MODE</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: refreshMode === 'auto' }"
                      @click="setRefreshMode('auto')">AUTO</button>
              <button class="toggle-btn" :class="{ active: refreshMode === 'manual' }"
                      @click="setRefreshMode('manual')">MANUAL</button>
            </div>
            <div class="field-note">AUTO: board updates every 30s, roadmap every 60s. MANUAL: refresh only on click.</div>
          </div>
        </div>

        <!-- Theme section -->
        <div class="settings-section">
          <div class="settings-section-title">// THEME</div>
          <div class="field-group">
            <div class="field-label">UI_THEME</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: currentTheme === 'matrix' }"
                      @click="setTheme('matrix')">MATRIX</button>
              <button class="toggle-btn" :class="{ active: currentTheme === 'light' }"
                      @click="setTheme('light')">LIGHT</button>
            </div>
            <div class="field-note">MATRIX: dark cyberpunk with neon glow. LIGHT: warm cream with minimal shadows.</div>
          </div>
        </div>

        <!-- Capture Terminal mode section -->
        <div class="settings-section">
          <div class="settings-section-title">// CAPTURE TERMINAL</div>
          <div class="field-group">
            <div class="field-label">CAPTURE_TERMINAL_MODE</div>
            <div class="toggle-row">
              <button class="toggle-btn" :class="{ active: captureMode === 'simple' }"
                      @click="setCaptureMode('simple')">SIMPLE</button>
              <button class="toggle-btn" :class="{ active: captureMode === 'extended' }"
                      @click="setCaptureMode('extended')">EXTENDED</button>
            </div>
            <div class="field-note">SIMPLE: chat-style terminal. EXTENDED: card-based UI with live preview and Jira Import.</div>
          </div>
        </div>

        <!-- LLM Providers section (replaces LLM Provider + Transcription Provider) -->
        <div class="settings-section">
          <div class="settings-section-title">// LLM PROVIDERS</div>

          <!-- Ollama connection settings -->
          <div class="provider-config-block">
            <div class="provider-config-header">OLLAMA</div>
            <div class="field-group">
              <div class="field-label">OLLAMA_URL</div>
              <input class="field-input" v-model="ollamaUrl"
                     placeholder="http://192.168.0.21:11434"
                     @change="saveProviderSettings">
            </div>
            <div class="field-group">
              <div class="field-label">OLLAMA_MODEL</div>
              <input class="field-input" v-model="ollamaModel"
                     placeholder="qwen3.5:latest" style="width: 250px;"
                     @change="saveProviderSettings">
            </div>
            <div class="ollama-test-row">
              <button class="cmd-btn cmd-btn-cyan" :disabled="ollamaTesting"
                      @click="testOllamaConnection()">
                {{ ollamaTesting ? '...' : 'TEST CONNECTION' }}
              </button>
              <span v-if="ollamaStatus && ollamaStatus.status === 'ok'" class="ollama-status ok">
                Connected &mdash; Ollama v{{ ollamaStatus.ollama_version }}
              </span>
              <span v-if="ollamaStatus && ollamaStatus.status === 'error'" class="ollama-status err">
                {{ ollamaStatus.detail }}
              </span>
            </div>
          </div>

          <!-- OpenRouter connection settings -->
          <div class="provider-config-block">
            <div class="provider-config-header">OPENROUTER</div>
            <div class="field-group">
              <div class="field-label">OPENROUTER_MODEL</div>
              <searchable-model-select
                  :models="openrouterModels"
                  v-model="openrouterModel"
                  :source="openrouterModelsSource"
                  @update:model-value="saveProviderSettings">
              </searchable-model-select>
              <div v-if="openrouterModelsSource === 'fallback'" class="field-note" style="color: #f44336;">
                используется резервный список моделей (OpenRouter API недоступен)
              </div>
            </div>
            <div class="field-group">
              <div class="field-label">API_KEY_STATUS</div>
              <div style="font-size: 11px; margin-top: 4px;">
                <span v-if="openrouterKeyStatus && openrouterKeyStatus.has_key"
                      style="color: #4caf50;">OPENROUTER_API_KEY is set in .env</span>
                <span v-else style="color: #f44336;">OPENROUTER_API_KEY is NOT set</span>
              </div>
            </div>
            <div class="ollama-test-row">
              <button class="cmd-btn cmd-btn-cyan" :disabled="openrouterTesting"
                      @click="testOpenRouterConnection()">
                {{ openrouterTesting ? '...' : 'TEST CONNECTION' }}
              </button>
              <span v-if="openrouterStatus && openrouterStatus.status === 'ok'"
                    class="ollama-status ok">
                Connected &mdash; {{ openrouterStatus.model_name }} available
              </span>
              <span v-if="openrouterStatus && openrouterStatus.status === 'error'"
                    class="ollama-status err">
                {{ openrouterStatus.detail }}
              </span>
            </div>
          </div>
        </div>

        <!-- AI AGENT -->
        <div class="settings-section">
          <div class="settings-section-title">// AI AGENT</div>
          <div class="provider-config-block">
            <div class="provider-config-header">МОДЕЛЬ ДЛЯ AI-АГЕНТА В РЕДАКТОРЕ ИДЕИ</div>
            <div class="field-group">
              <div class="field-label">ПРОВАЙДЕР</div>
              <div class="toggle-row">
                <button class="toggle-btn toggle-btn-triple"
                        :class="{ active: aiAgentProvider === 'claude' }"
                        @click="aiAgentProvider = 'claude'; trySaveUserPrefs()">CLAUDE</button>
                <button class="toggle-btn toggle-btn-triple"
                        :class="{ active: aiAgentProvider === 'ollama' }"
                        @click="aiAgentProvider = 'ollama'; trySaveUserPrefs()">OLLAMA</button>
                <button class="toggle-btn toggle-btn-triple"
                        :class="{ active: aiAgentProvider === 'openrouter' }"
                        @click="aiAgentProvider = 'openrouter'; trySaveUserPrefs()">OPENROUTER</button>
              </div>
            </div>
            <div class="field-group" v-if="aiAgentProvider === 'openrouter'">
              <div class="field-label">МОДЕЛЬ OPENROUTER</div>
              <searchable-model-select
                :models="openrouterModels"
                v-model="aiAgentModel"
                :source="openrouterModelsSource"
                compact
                @update:model-value="trySaveUserPrefs()">
              </searchable-model-select>
            </div>
            <div class="field-note">
              Провайдер и модель для AI-агента в редакторе идеи. Не влияет на Playground и fallback-цепочки.
            </div>
          </div>
        </div>

        <!-- BUSINESS CONTEXT -->
        <div class="settings-section">
          <div class="settings-section-title">// BUSINESS CONTEXT</div>
          <div class="provider-config-block">
            <div class="provider-config-header">ОПИСАНИЕ БИЗНЕСА ДЛЯ LLM-ПРОМПТОВ</div>
            <div class="field-group">
              <textarea v-model="businessContext" rows="8"
                        class="bc-textarea"
                        placeholder="Опишите ваш бизнес, продукт, целевую аудиторию, ключевые метрики..."></textarea>
            </div>
            <div class="field-note">
              Этот текст подставляется в промпты News Moderator, Research Runner и AI-агента.
              Чем точнее описание — тем релевантнее результаты анализа.
            </div>
            <button class="cmd-btn cmd-btn-cyan" @click="saveBusinessContext">SAVE</button>
            <span v-if="bcSaveStatus" class="save-flash" :class="bcSaveStatus">{{ bcSaveMessage }}</span>
          </div>
        </div>

        <!-- Operation Groups with fallback chains -->
        <div class="settings-section">
          <div class="settings-section-title">// FALLBACK CHAINS</div>

          <div v-for="group in operationGroups" :key="group.key"
               class="fallback-group-card">
            <div class="fallback-group-header">
              <span class="fallback-group-name">{{ group.name }}</span>
              <span class="fallback-group-ops">{{ group.operations.join(', ') }}</span>
            </div>

            <!-- Sortable fallback chain -->
            <div class="fallback-chain"
                 @dragover.prevent="handleDragOver($event, group.key)"
                 @drop="handleDrop($event, group.key)">

              <div v-for="(step, idx) in group.chain" :key="step.provider + ':' + (step.model || '') + '-' + idx"
                   class="fallback-item"
                   :class="{
                     'fallback-item--solo': group.chain.length === 1,
                     'drag-over-above': dragState.group === group.key && dragState.targetIdx === idx && dragState.position === 'above',
                     'drag-over-below': dragState.group === group.key && dragState.targetIdx === idx && dragState.position === 'below'
                   }"
                   :draggable="group.chain.length > 1 ? 'true' : 'false'"
                   @dragstart="handleDragStart($event, group.key, idx)"
                   @dragend="handleDragEnd">
                <span class="fallback-item-handle"
                      v-if="group.chain.length > 1">::</span>
                <span class="fallback-item-index">{{ idx + 1 }}</span>
                <span class="fallback-item-name">{{ providerDisplayName(step) }}</span>
                <searchable-model-select
                    v-if="step.provider === 'openrouter'"
                    :models="openrouterModels"
                    v-model="step.model"
                    :source="openrouterModelsSource"
                    compact
                    @update:model-value="saveProviderSettings">
                </searchable-model-select>
                <span v-if="step.provider === 'openrouter' && openrouterModelsSource === 'fallback'"
                      class="fallback-item-fallback-note">резервный список</span>
                <span v-if="step.provider === 'openrouter' && !isStepModelValid(step)"
                      class="fallback-item-fallback-note">Выберите модель для OpenRouter</span>
                <button class="fallback-item-remove"
                        v-if="group.chain.length > 1"
                        @click="removeFromChain(group.key, idx)"
                        title="Remove">&times;</button>
              </div>
            </div>

            <!-- Available providers to add -->
            <div class="fallback-add-row"
                 v-if="availableProviders(group.key).length > 0">
              <button v-for="p in availableProviders(group.key)" :key="p"
                      class="cmd-btn cmd-btn-small"
                      @click="addToChain(group.key, p)">
                + {{ providerDisplayName(p) }}
              </button>
            </div>
          </div>
        </div>

        <!-- Vector Store / Embeddings (BL-237) -->
        <div class="settings-section">
          <div class="settings-section-title">// VECTOR STORE / EMBEDDINGS</div>

          <div class="provider-config-block">
            <div class="provider-config-header">EMBEDDING FALLBACK</div>
            <div v-for="(p, idx) in embeddingFallback" :key="p"
                 class="emb-chain-item"
                 draggable="true"
                 @dragstart="embDragStart($event, idx)"
                 @dragover.prevent
                 @drop="embDrop($event)">
              <span>{{ idx + 1 }}.</span>
              <span>{{ p }}</span>
              <span class="field-note">{{ idx === 0 ? 'primary' : 'fallback' }}</span>
            </div>
            <div class="field-note">Порядок определяет приоритет. Primary embedding провайдер используется первым, при ошибке — fallback.</div>
          </div>

          <div class="provider-config-block">
            <div class="provider-config-header">МОДЕЛИ EMBEDDING</div>
            <div class="field-group">
              <div class="field-label">OLLAMA_EMBEDDING_MODEL</div>
              <input class="field-input" v-model="embModelOllama" placeholder="nomic-embed-text" @change="trySaveUserPrefs()" style="width: 250px;">
            </div>
            <div class="field-group">
              <div class="field-label">OPENAI_EMBEDDING_MODEL</div>
              <input class="field-input" v-model="embModelOpenai" placeholder="text-embedding-3-small" @change="trySaveUserPrefs()" style="width: 250px;">
            </div>
            <div class="field-group">
              <div class="field-label">VECTOR_DIMENSION</div>

                    <span v-if="p.is_modified" class="prompt-item-modified">modified</span>
                  </div>
                  <div v-show="promptExpanded[group.component + '/' + p.name]" class="prompt-item-body">
                    <textarea class="prompt-editor" v-model="p.content" :rows="Math.max(10, p.lines + 2)"></textarea>
                    <div v-if="p.variables && p.variables.length" class="prompt-var-list">
                      <span v-for="v in p.variables" :key="v" class="prompt-var-badge" :title="'Переменная: {' + v + '}'">{{ '{' + v + '}' }}</span>
                    </div>
                    <div class="prompt-actions">
                      <cmd-button label="SAVE" color="cyan" :loading="promptSaving[group.component + '/' + p.name]" :disabled="!isPromptDirty(group.component, p.name)" @click="savePrompt(group.component, p.name)"></cmd-button>
                      <cmd-button v-if="p.is_modified" label="RESET" color="magenta" :loading="promptSaving[group.component + '/' + p.name]" @click="resetPrompt(group.component, p.name)"></cmd-button>
                      <span v-if="promptSaveStatus[group.component + '/' + p.name]" class="save-status text-green" style="font-size:10px">{{ promptSaveStatus[group.component + '/' + p.name] }}</span>
                    </div>
                  </div>
                </div>
              </div>

        <!-- Save bar -->
        <div class="save-bar">
          <cmd-button label="SAVE" color="cyan" :loading="saving" @click="saveSettings"></cmd-button>
          <span v-if="saveStatus" class="save-status" :class="saveOk ? 'text-green' : 'text-magenta'">{{ saveStatus }}</span>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script>
  console.log('[settings] initializing settings page');

  var { createApp, ref, reactive, onMounted } = Vue;

  var app = createApp({
    setup: function() {
      var settings = reactive({
        vault_path: '',
        transcripts_path: '',
        roadmap_now_label: '',
        roadmap_next_label: '',
        roadmap_later_label: '',
      });
      var loading = ref(true);
      var error = ref(null);
      var saving = ref(false);
      var saveStatus = ref('');
      var saveOk = ref(false);
      var refreshMode = ref('auto');
      var refreshSaving = ref(false);
      var currentTheme = ref('matrix');
      var syncing = ref(false);
      var lastSyncTime = ref(null);
      var syncResult = ref('');
      var syncOk = ref(false);
      var llmProvider = ref('claude');
      var ollamaUrl = ref('');
      var ollamaModel = ref('qwen3.5:latest');
      var ollamaStatus = ref(null);
      var ollamaTesting = ref(false);
      var caldavUsername = ref('');
      var caldavPassword = ref('');
      var caldavTimezone = ref('Europe/Moscow');
      var caldavUrl = ref('https://caldav.yandex.ru/');
      var caldavTesting = ref(false);
      var caldavStatus = ref(null);
      var llmSaving = ref(false);
      var jiraSyncNotify = ref(true);
      var captureMode = ref('simple');
      var transcriptionProvider = ref('default');
      var openrouterModel = ref('qwen/qwen3-32b');
      var openrouterModels = ref([]);
      var openrouterModelsSource = ref('live');
      var openrouterKeyStatus = ref(null);
      var openrouterStatus = ref(null);
      var openrouterTesting = ref(false);
      var searchOpen = ref(false);
      var relevanceThreshold = ref(7);
      var fetchingMeetings = ref(false);
      var fetchMeetingsStatus = ref('');
      var aiAgentProvider = ref('claude');
      var aiAgentModel = ref('');
      var businessContext = ref('');
      var bcSaveStatus = ref('');
      var bcSaveMessage = ref('');

      // Prompts (BL-197)
      var promptGroups = ref([]);
      var promptsLoading = ref(true);
      var promptSaving = reactive({});
      var promptExpanded = reactive({});
      var promptSaveStatus = reactive({});

      function loadPrompts() {
        promptsLoading.value = true;
        apiFetch('/prompts/all').then(function(data) {
          promptGroups.value = Object.entries(data).map(function(entry) {
            var comp = entry[0];
            var info = entry[1];
            return {
              component: comp,
              status: info.status,
              error: info.error || null,
              prompts: (info.prompts || []).map(function(p) {
                return Object.assign({}, p, { original: p.content });
              }),
              collapsed: comp !== 'pm-bot'
            };
          });
          console.log('[settings] prompts loaded:', promptGroups.value.map(function(g) { return g.component + '(' + g.prompts.length + ')'; }));
          promptsLoading.value = false;
        }).catch(function(e) {
          console.error('[settings] loadPrompts error:', e.message);
          promptsLoading.value = false;
        });
      }

      function savePrompt(component, name) {
        var key = component + '/' + name;
        promptSaving[key] = true;
        promptSaveStatus[key] = '';
        var group = promptGroups.value.find(function(g) { return g.component === component; });
        var prompt = group.prompts.find(function(p) { return p.name === name; });
        apiFetch('/prompts/' + component + '/' + name, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: prompt.content })
        }).then(function(res) {
          prompt.is_modified = res.is_modified;
          prompt.lines = res.lines;
          prompt.original = prompt.content;
          promptSaveStatus[key] = 'SAVED';
          setTimeout(function() { promptSaveStatus[key] = ''; }, 3000);
          console.log('[settings] prompt saved:', key);
          promptSaving[key] = false;
        }).catch(function(e) {
          promptSaveStatus[key] = 'ERROR: ' + e.message;
          console.error('[settings] savePrompt error:', key, e.message);
          promptSaving[key] = false;
        });
      }

      function resetPrompt(component, name) {
        if (!confirm('Вернуть промпт ' + name + ' к оригинальной версии?')) return;
        var key = component + '/' + name;
        promptSaving[key] = true;
        promptSaveStatus[key] = '';
        apiFetch('/prompts/' + component + '/' + name + '/reset', {
          method: 'POST'
        }).then(function(res) {
          var group = promptGroups.value.find(function(g) { return g.component === component; });
          var prompt = group.prompts.find(function(p) { return p.name === name; });
          prompt.content = res.content;
          prompt.is_modified = false;
          prompt.lines = res.lines;
          prompt.original = res.content;
          promptSaveStatus[key] = 'RESET';
          setTimeout(function() { promptSaveStatus[key] = ''; }, 3000);
          console.log('[settings] prompt reset:', key);
          promptSaving[key] = false;
        }).catch(function(e) {
          promptSaveStatus[key] = 'ERROR: ' + e.message;
          console.error('[settings] resetPrompt error:', key, e.message);
          promptSaving[key] = false;
        });
      }

      function togglePromptGroup(component) {
        var group = promptGroups.value.find(function(g) { return g.component === component; });
        if (group) group.collapsed = !group.collapsed;
      }

      function togglePromptItem(component, name) {
        var key = component + '/' + name;
        promptExpanded[key] = !promptExpanded[key];
      }

      function isPromptDirty(component, name) {
        var group = promptGroups.value.find(function(g) { return g.component === component; });
        if (!group) return false;
        var prompt = group.prompts.find(function(p) { return p.name === name; });
        if (!prompt) return false;
        return prompt.content !== prompt.original;
      }

      var operationGroups = ref([
        {
          key: 'capture',
          name: 'CAPTURE',
          operations: ['idea', 'daily', 'jira_ticket'],
          chain: [{ provider: 'claude', model: null }]
        },
        {
          key: 'transcription',
          name: 'TRANSCRIPTION',
          operations: ['meeting', 'meeting_protocol'],
          chain: [{ provider: 'claude', model: null }]
        },
        {
          key: 'analysis',
          name: 'ANALYSIS',
          operations: ['enrich', 'synthesize', 'report'],
          chain: [{ provider: 'claude', model: null }]
        },
        {
          key: 'pipeline',
          name: 'PIPELINE',
          operations: ['pipeline_analyst', 'pipeline_pm', 'pipeline_decomposer'],
          chain: [{ provider: 'claude', model: null }]
        },
        {
          key: 'digest',
          name: 'DIGEST',
          operations: ['digest'],
          chain: [{ provider: 'ollama', model: null }]
        },
        {
          key: 'signal_triage',
          name: 'SIGNAL TRIAGE',
          operations: ['signal_score', 'quality_check', 'dedup_check'],
          chain: [{ provider: 'openrouter', model: null }]
        },
        {
          key: 'signal_deep',
          name: 'SIGNAL DEEP',
          operations: ['completeness_check'],
          chain: [{ provider: 'openrouter', model: null }]
        },
        {
          key: 'signal_analysis',
          name: 'SIGNAL ANALYSIS',
          operations: ['signal_analyze', 'report_to_ideas', 'trend_detect'],
          chain: [{ provider: 'openrouter', model: null }]
        },
        {
          key: 'signal_escalation',
          name: 'SIGNAL ESCALATION',
          operations: ['signal_analyze_escalation'],
          chain: [{ provider: 'openrouter', model: null }]
        }
      ]);

      var dragState = ref({
        group: null,
        sourceIdx: null,
        targetIdx: null,
        position: null
      });

      var allProviders = ['claude', 'ollama', 'openrouter'];
      var DEFAULT_OPENROUTER_MODEL_FALLBACK = 'qwen/qwen3-32b';

      // Normalize a single fallback-chain step to canonical {provider, model} form.
      // GET /api/v1/user-prefs (T-08) already returns canonical objects for every step
      // (model is always a non-empty string for provider=="openrouter", always null for
      // claude/ollama) -- this is a defensive safety net, not a required migration path.
      function normalizeChainStep(el) {
        if (typeof el === 'string') {
          return { provider: el, model: el === 'openrouter' ? (openrouterModel.value || null) : null };
        }
        if (el && typeof el === 'object') {
          return { provider: el.provider, model: el.model != null ? el.model : null };
        }
        return { provider: String(el), model: null };
      }

      // Default model assigned to a freshly-added OpenRouter chain step: first model from
      // the loaded list (live or fallback), then the global OPENROUTER_MODEL setting, then
      // a hardcoded last-resort constant. Ensures a step is never added with an empty model
      // (T-10 will additionally block save if this invariant is ever violated).
      function defaultOpenRouterModel() {
        if (openrouterModels.value && openrouterModels.value.length > 0) {
          return openrouterModels.value[0].id;
        }
        return openrouterModel.value || DEFAULT_OPENROUTER_MODEL_FALLBACK;
      }

      function openRouterModelName(modelId) {
        if (!modelId) return '';
        var found = (openrouterModels.value || []).find(function(m) { return m.id === modelId; });
        return found ? found.name : modelId;
      }

      // AC-06 client-side guard: a chain step with provider=="openrouter" must always carry
      // a non-empty model. Non-openrouter steps (claude/ollama) never fail this check --
      // they don't carry a per-step model at all.
      function isStepModelValid(step) {
        if (!step || step.provider !== 'openrouter') return true;
        return !!(step.model && String(step.model).trim());
      }

      // Scan every operation group's chain for OpenRouter steps missing a model.
      // Returns the list of group keys that currently contain at least one invalid step
      // (used both for the console warning and to decide whether to block the PUT).
      function findInvalidOpenRouterChainGroups() {
        return operationGroups.value
          .filter(function(group) {
            return group.chain.some(function(step) { return !isStepModelValid(step); });
          })
          .map(function(group) { return group.key; });
      }

      // Single choke point for PUT /api/v1/user-prefs (AC-06). defaultOpenRouterModel()
      // (T-09) already guarantees a non-empty model when a new OpenRouter step is added, so
      // this should practically never trigger -- it's defense-in-depth for a corrupted/edge
      // client state. api.saveUserPrefs() is called from several places (chain edits via
      // saveProviderSettings, but also setRefreshMode/setTheme/setJiraSyncNotify/
      // setCaptureMode, which resend the whole payload including the fallback chains), so the
      // guard lives here rather than only inside saveProviderSettings to cover all of them.
      // --- Vector Store / Embeddings (BL-237) ---
      var embeddingFallback = ref(['ollama', 'openai']);
      var embModelOllama = ref('nomic-embed-text');
      var embModelOpenai = ref('text-embedding-3-small');
      var embDim = ref(768);
      var embTesting = ref(false);
      var embTestResult = ref(null);
      var reindexing = ref(false);
      var reindexStatus = ref(null);
      var vectorStats = ref(null);

      var reindexStatusText = Vue.computed(function() {
        if (!reindexStatus.value) return '';
        var s = reindexStatus.value;
        if (s.status === 'running') return 'Running: ' + (s.processed || 0) + '/' + (s.total || '?');
        if (s.status === 'done') return 'Done: ' + (s.processed || 0) + ' records';
        if (s.status === 'idle') return 'Idle';
        return s.status;
      });

      function testEmbedding() {
        console.log('[settings] testEmbedding');
        embTesting.value = true;
        embTestResult.value = null;
        apiFetch('/providers/test-ollama-embedding', { method: 'POST' })
          .then(function(data) {
            embTestResult.value = data;
            embTesting.value = false;
            console.log('[settings] testEmbedding result:', data);
          })
          .catch(function(err) {
            console.error('[settings] testEmbedding error:', err.message);
            embTestResult.value = { status: 'error', detail: err.message };
            embTesting.value = false;
          });
      }

      function startReindex() {
        console.log('[settings] startReindex');
        reindexing.value = true;
        reindexStatus.value = null;
        apiFetch('/reindex', { method: 'POST' })
          .then(function(data) {
            reindexStatus.value = data;
            if (data.status === 'started' || data.status === 'running' || data.status === 'already_running') {
              pollReindexStatus();
            } else {
              reindexing.value = false;
            }
          })
          .catch(function(err) {
            console.error('[settings] startReindex error:', err.message);
            reindexStatus.value = { status: 'error', detail: err.message };
            reindexing.value = false;
          });
      }

      function pollReindexStatus() {
        console.log('[settings] pollReindexStatus');
        var pollInterval = setInterval(function() {
          apiFetch('/reindex/status')
            .then(function(data) {
              reindexStatus.value = data;

      function providerDisplayName(step) {
        var provider = typeof step === 'string' ? step : (step && step.provider);
        var names = {

          'ollama': 'Ollama',

      function findGroup(key) {

      function handleDragStart(event, groupKey, idx) {
        console.log('[settings] dragStart:', groupKey, idx);
        dragState.value = { group: groupKey, sourceIdx: idx, targetIdx: null, position: null };
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', groupKey + ':' + idx);
      }

      function handleDragOver(event, groupKey) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';

        var target = event.target.closest('.fallback-item');
        if (!target) return;

        var rect = target.getBoundingClientRect();
        var midY = rect.top + rect.height / 2;
        var position = event.clientY < midY ? 'above' : 'below';

        var items = target.parentElement.querySelectorAll('.fallback-item');
        var targetIdx = Array.from(items).indexOf(target);

        dragState.value.targetIdx = targetIdx;
        dragState.value.position = position;
      }

      function handleDrop(event, groupKey) {
        event.preventDefault();
        console.log('[settings] drop:', groupKey, dragState.value);

        var state = dragState.value;
        if (state.group !== groupKey || state.sourceIdx === null || state.targetIdx === null) {
          handleDragEnd();
          return;
        }

        var group = findGroup(groupKey);
        if (!group) {
          handleDragEnd();
          return;
        }

        var chain = group.chain;
        var sourceIdx = state.sourceIdx;
        var targetIdx = state.targetIdx;

        var newIdx = state.position === 'below' ? targetIdx + 1 : targetIdx;

        if (newIdx === sourceIdx || newIdx === sourceIdx + 1) {
          handleDragEnd();
          return;
        }

        var item = chain.splice(sourceIdx, 1)[0];
        if (newIdx > sourceIdx) newIdx--;
        chain.splice(newIdx, 0, item);

        console.log('[settings] chain reordered:', groupKey, chain);
        handleDragEnd();
        saveProviderSettings();
      }

      function handleDragEnd() {
        dragState.value = { group: null, sourceIdx: null, targetIdx: null, position: null };
      }

      function removeFromChain(groupKey, idx) {
        var group = findGroup(groupKey);
        if (!group) return;
        if (group.chain.length <= 1) {
          console.log('[settings] cannot remove last provider from', groupKey);
          return;
        }
        var removed = group.chain.splice(idx, 1)[0];
        console.log('[settings] removed', removed, 'from', groupKey);
        saveProviderSettings();
      }

      function addToChain(groupKey, provider) {
        var group = findGroup(groupKey);
        if (!group) return;
        // claude/ollama remain one-shot per chain; openrouter can be added repeatedly
        // with a different model each time (this is the whole point of BL-155).
        if (provider !== 'openrouter') {
          var alreadyPresent = group.chain.some(function(s) { return s.provider === provider; });
          if (alreadyPresent) return;
        }
        var step = { provider: provider, model: provider === 'openrouter' ? defaultOpenRouterModel() : null };
        group.chain.push(step);
        console.log('[settings] added', provider, 'to', groupKey, step.model || '');
        saveProviderSettings();
      }

      function availableProviders(groupKey) {
        var group = findGroup(groupKey);
        if (!group) return [];
        var usedProviders = group.chain.map(function(s) { return s.provider; });
        return allProviders.filter(function(p) {
          if (p === 'openrouter') return true; // never excluded -- can add more than once
          return usedProviders.indexOf(p) === -1;
        });
      }
