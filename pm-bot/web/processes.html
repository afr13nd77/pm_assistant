<!DOCTYPE html>
<html lang="ru" class="theme-matrix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Board — Processes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-matrix.css" id="theme-css">
  <script>
  (function() {
    try {
      var t = localStorage.getItem('pm_theme');
      if (t === 'light') {
        document.documentElement.className = 'theme-light';
        document.getElementById('theme-css').href = 'style-light.css';
      }
    } catch(e) {}
  })();
  </script>
  <style>
  .process-section-title {
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.6;
    text-transform: uppercase;
    margin: 24px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .process-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .process-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .process-card:hover {
    border-color: var(--cyan);
  }
  a.process-card {
    text-decoration: none;
    color: var(--text);
    display: block;
  }
  .process-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .process-icon {
    font-size: 20px;
  }
  .process-name {
    font-size: 14px;
    font-weight: 600;
  }
  .process-num {
    font-size: 11px;
    opacity: 0.4;
    font-family: 'JetBrains Mono', monospace;
  }
  .process-trigger {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 8px;
  }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <app-sidebar active="about"></app-sidebar>
    <main class="page-content" style="position: relative; overflow: hidden;">
      <div class="scan-line"></div>
      <div class="text-page-title">PROCESSES</div>

      <div class="process-section-title">БИЗНЕС-ПРОЦЕССЫ</div>
      <div class="process-grid">
        <a v-for="p in businessProcesses" :key="p.id"
           :href="'process.html?id=' + p.id"
           class="process-card">
          <div class="process-card-header">
            <span class="process-num">#{{ String(p.id).padStart(2, '0') }}</span>
            <span class="process-icon">{{ p.icon }}</span>
            <span class="process-name">{{ p.name }}</span>
          </div>
          <div class="process-trigger">{{ p.trigger }}</div>
        </a>
      </div>

      <div class="process-section-title">ТЕХНИЧЕСКИЕ ПРОЦЕССЫ</div>
      <div class="process-grid">
        <a v-for="p in techProcesses" :key="p.id"
           :href="'process.html?id=' + p.id"
           class="process-card">
          <div class="process-card-header">
            <span class="process-num">#{{ String(p.id).padStart(2, '0') }}</span>
            <span class="process-icon">{{ p.icon }}</span>
            <span class="process-name">{{ p.name }}</span>
          </div>
          <div class="process-trigger">{{ p.trigger }}</div>
        </a>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script src="processes-data.js"></script>
  <script>
  const { createApp, ref, computed } = Vue;

  const app = createApp({
    setup() {
      var processes = ref(PROCESSES_DATA);

      var businessProcesses = computed(function() {
        return processes.value.filter(function(p) { return p.section === 'business'; });
      });

      var techProcesses = computed(function() {
        return processes.value.filter(function(p) { return p.section === 'tech'; });
      });

      return { processes, businessProcesses, techProcesses };
    }
  });

  registerComponents(app);
  applyPageTheme().then(function() {
    app.mount('#app');
  });
  </script>
</body>
</html>
