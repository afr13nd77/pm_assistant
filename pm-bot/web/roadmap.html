<!DOCTYPE html>
<html lang="ru" class="theme-matrix">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Board — Roadmap</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-matrix.css" id="theme-css">
  <script>
  (function() {
    try {
      var t = localStorage.getItem('pm_theme');
      if (t === 'light') {
        document.documentElement.className = 'theme-light';
        document.getElementById('theme-css').href = 'style-light.css';
      }
    } catch(e) {}
  })();
  </script>
</head>
<body>
  <div id="app" v-cloak>
    <app-sidebar active="roadmap" @search="searchOpen = true"></app-sidebar>
    <search-overlay :open="searchOpen" @close="searchOpen = false"></search-overlay>
    <main class="page-content" style="position: relative; overflow: hidden;">
      <div class="scan-line"></div>
      <div class="page-header">
        <div class="text-page-title">PRODUCT_ROADMAP // Content System</div>
        <span class="refresh-icon" :class="{ spinning: loading }" @click="loadEpics" title="Refresh">&#8635;</span>
      </div>

      <div class="metrics-grid" v-if="!loading">
        <metric-box label="TOTAL" :value="totalCount" color="cyan"></metric-box>
        <metric-box label="BACKLOG" :value="backlogCount" color="yellow"></metric-box>
        <metric-box label="IN_PROGRESS" :value="inProgressCount" color="magenta"></metric-box>
        <metric-box label="DONE" :value="doneCount" color="green"></metric-box>
      </div>

      <!-- Domain filter tabs -->
      <div class="domain-tabs" v-if="domains.length" style="margin-top: 10px;">
        <button class="domain-tab" :class="{ active: !activeDomain }" @click="selectDomain(null)">ALL</button>
        <button class="domain-tab" v-for="d in domains" :key="d.name"
          :class="{ active: activeDomain === d.name }"
          @click="selectDomain(d.name)">
          {{ d.name.toUpperCase() }} [{{ d.epics_count }}]
        </button>
      </div>

      <div v-if="loading" class="loading">LOADING...</div>
      <div v-if="error" class="empty-state">{{ error }}</div>

      <div class="roadmap-grid" v-if="!loading">
        <!-- BACKLOG column -->
        <div>
          <div class="section-label">BACKLOG</div>
          <epic-card v-for="epic in visibleBacklog" :key="epic.id"
            :id="epic.id" :title="epic.title" :priority="epic.priority"
            :progress="epic.progress" :prd_status="epic.prd_status"
            :tickets="epic.tickets || []"
            @click="selectEpic(epic)"
          ></epic-card>
          <button v-if="backlogEpics.length > visibleBacklog.length" class="cmd-btn cmd-btn-muted" style="width:100%;margin-top:4px;" @click="showMore">SHOW MORE ({{ backlogEpics.length - visibleBacklog.length }} hidden)</button>
          <div v-if="!backlogEpics.length" class="empty-state">No epics</div>
        </div>

        <!-- TODO column -->
        <div>
          <div class="section-label">TODO</div>
          <epic-card v-for="epic in visibleTodo" :key="epic.id"
            :id="epic.id" :title="epic.title" :priority="epic.priority"
            :progress="epic.progress" :prd_status="epic.prd_status"
            :tickets="epic.tickets || []"
            @click="selectEpic(epic)"
          ></epic-card>
          <button v-if="todoEpics.length > visibleTodo.length" class="cmd-btn cmd-btn-muted" style="width:100%;margin-top:4px;" @click="showMore">SHOW MORE ({{ todoEpics.length - visibleTodo.length }} hidden)</button>
          <div v-if="!todoEpics.length" class="empty-state">No epics</div>
        </div>

        <!-- IN PROGRESS column -->
        <div>
          <div class="section-label">IN PROGRESS</div>
          <epic-card v-for="epic in visibleInprogress" :key="epic.id"
            :id="epic.id" :title="epic.title" :priority="epic.priority"
            :progress="epic.progress" :prd_status="epic.prd_status"
            :tickets="epic.tickets || []"
            @click="selectEpic(epic)"
          ></epic-card>
          <button v-if="inprogressEpics.length > visibleInprogress.length" class="cmd-btn cmd-btn-muted" style="width:100%;margin-top:4px;" @click="showMore">SHOW MORE ({{ inprogressEpics.length - visibleInprogress.length }} hidden)</button>
          <div v-if="!inprogressEpics.length" class="empty-state">No epics</div>
        </div>

        <!-- DONE column -->
        <div>
          <div class="section-label">DONE</div>
          <epic-card v-for="epic in visibleDone" :key="epic.id"
            :id="epic.id" :title="epic.title" :priority="epic.priority"
            :progress="epic.progress" :prd_status="epic.prd_status"
            :tickets="epic.tickets || []"
            @click="selectEpic(epic)"
          ></epic-card>
          <button v-if="doneEpics.length > visibleDone.length" class="cmd-btn cmd-btn-muted" style="width:100%;margin-top:4px;" @click="showMore">SHOW MORE ({{ doneEpics.length - visibleDone.length }} hidden)</button>
          <div v-if="!doneEpics.length" class="empty-state">No epics</div>
        </div>
      </div>

    </main>
    <div class="drawer-overlay" v-if="drawerOpen" @click="closeDrawer"></div>
    <div class="task-drawer" :class="{ open: drawerOpen }">

      <!-- ═══ EPIC MODE ═══ -->
      <template v-if="drawerMode === 'epic' && drawerEpic">
        <header class="epic-drawer-header">
          <div class="epic-header-top">
            <div class="epic-entity">
              <span class="epic-entity-type">Epic</span>
              <span class="epic-entity-code">{{ drawerEpic.id }}</span>
            </div>
            <div class="epic-header-actions">
              <button class="epic-icon-button" title="Actions">&#8226;&#8226;&#8226;</button>
              <button class="epic-icon-button" @click="closeDrawer" title="Close">&#10005;</button>
            </div>
          </div>
          <div class="epic-title-row">
            <h2 class="epic-title">{{ drawerEpic.title || '—' }}</h2>
          </div>
          <div class="epic-badges">
            <span class="epic-badge epic-badge-status" :class="'epic-badge-status--' + (drawerEpic.status || '').toLowerCase().replace(/[^a-z]/g, '-')">
              <span class="epic-badge-dot"></span>{{ (drawerEpic.status || '—').toUpperCase() }}
            </span>
            <span class="epic-badge epic-badge-domain" v-if="drawerEpic.domain">
              <span class="epic-badge-dot"></span>{{ drawerEpic.domain.toUpperCase() }}
            </span>
            <span class="epic-badge epic-badge-priority" v-if="drawerEpic.priority">{{ drawerEpic.priority.toUpperCase() }}</span>
          </div>
        </header>

        <nav class="epic-tabs">
          <button class="epic-tab" :class="{ active: activeEpicTab === 'overview' }" @click="selectEpicTab('overview')">Обзор</button>
          <button class="epic-tab" :class="{ active: activeEpicTab === 'description' }" @click="selectEpicTab('description')">Описание</button>
          <button class="epic-tab" :class="{ active: activeEpicTab === 'jira' }" @click="selectEpicTab('jira')">Jira &middot; {{ (drawerEpic.tickets || []).length }}</button>
          <button class="epic-tab" :class="{ active: activeEpicTab === 'history' }" @click="selectEpicTab('history')">История</button>
        </nav>

        <div class="task-drawer-body">
          <!-- TAB: Overview -->
          <div class="epic-tab-panel" :class="{ active: activeEpicTab === 'overview' }">
            <div class="epic-section">
              <div class="epic-section-heading">
                <h3>Прогресс</h3>
              </div>
              <div class="epic-progress-card">
                <div class="epic-progress-head">
                  <span class="epic-progress-label">Готовность эпика</span>
                  <strong class="epic-progress-value">{{ drawerEpic.progress || 0 }}%</strong>
                </div>
                <div class="epic-progress-track">
                  <div class="epic-progress-fill" :style="{ width: (drawerEpic.progress || 0) + '%' }"></div>
                </div>
                <div class="epic-progress-meta">
                  <span>{{ (drawerEpic.tickets || []).length }} Jira tickets</span>
                  <span>PRD {{ (drawerEpic.prd_status || 'none').toUpperCase() }}</span>
                </div>
              </div>
            </div>

            <div class="epic-section">
              <div class="epic-section-heading">
                <h3>Основная информация</h3>
              </div>
              <div class="epic-info-grid">
                <div class="epic-info-item">
                  <span class="epic-info-label">Jira Epic</span>
                  <div class="epic-info-value">
                    <a v-if="drawerEpic.jira_url" :href="drawerEpic.jira_url" target="_blank" class="epic-link">{{ drawerEpic.jira_key || '—' }} &#8599;</a>
                    <span v-else class="text-muted">—</span>
                  </div>
                </div>
                <div class="epic-info-item">
                  <span class="epic-info-label">PRD</span>
                  <div class="epic-info-value">
                    <span :class="drawerEpic.prd_status === 'approved' ? 'text-green' : 'text-muted'">{{ (drawerEpic.prd_status || '—').toUpperCase() }}</span>
                  </div>
                </div>
                <div class="epic-info-item">
                  <span class="epic-info-label">Domain</span>
                  <div class="epic-info-value">
                    <span>{{ (drawerEpic.domain || '—').toUpperCase() }}</span>
                  </div>
                </div>
                <div class="epic-info-item">
                  <span class="epic-info-label">Confluence</span>
                  <div class="epic-info-value">
                    <a v-if="drawerEpic.confluence_link" :href="drawerEpic.confluence_link" target="_blank" class="epic-link">link &#8599;</a>
                    <span v-else class="text-muted">—</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="epic-section" v-if="!drawerEpic.jira_key">
              <jira-create-section
                :filename="drawerEpic.filename || ''"
                :current-type="'Epic'"
                :title="drawerEpic.title || ''"
                :has-jira-key="false"
                :jira-key="''"
                :jira-url="''"
                :is-epic="true"
                @created="onEpicJiraCreated"
              ></jira-create-section>
            </div>

            <div class="epic-section" v-if="drawerEpic.jira_key">
              <div class="epic-section-heading">
                <h3>Задача эпика в Jira</h3>
              </div>
              <div class="epic-ticket" @click="drawerEpic.jira_url && window.open(drawerEpic.jira_url, '_blank')">
                <div class="epic-ticket-icon">JR</div>
                <div class="epic-ticket-body">
                  <div class="epic-ticket-key">{{ drawerEpic.jira_key }}</div>
                  <div class="epic-ticket-title">{{ drawerEpic.title }}</div>
                </div>
                <span class="epic-ticket-status" :class="'epic-ticket-status--' + (drawerEpic.status || '').toLowerCase()">{{ (drawerEpic.status || '').toUpperCase() }}</span>
              </div>
            </div>
          </div>

          <!-- TAB: Description -->
          <div class="epic-tab-panel" :class="{ active: activeEpicTab === 'description' }">
            <div class="epic-section" v-if="drawerEpic.body">
              <div class="epic-section-heading">
                <h3>Описание</h3>
              </div>
              <div class="epic-body-content">
                <div class="task-drawer-content" v-html="renderMd(drawerEpic.body)"></div>
              </div>
            </div>
            <div class="epic-section" v-if="drawerEpic.goal">
              <div class="epic-section-heading">
                <h3>Цель</h3>
              </div>
              <div class="epic-body-content">
                <div class="task-drawer-content" v-html="renderMd(drawerEpic.goal)"></div>
              </div>
            </div>
            <div class="epic-section" v-if="drawerEpic.scope">
              <div class="epic-section-heading">
                <h3>Объём</h3>
              </div>
              <div class="epic-body-content">
                <div class="task-drawer-content" v-html="renderMd(drawerEpic.scope)"></div>
              </div>
            </div>
            <div class="epic-section" v-if="drawerEpic.acceptance_criteria">
              <div class="epic-section-heading">
                <h3>Критерии приёмки</h3>
              </div>
              <div class="epic-body-content">
                <div class="task-drawer-content" v-html="renderMd(drawerEpic.acceptance_criteria)"></div>
              </div>
            </div>
            <div class="epic-section" v-if="!drawerEpic.body && !drawerEpic.goal && !drawerEpic.scope && !drawerEpic.acceptance_criteria">
              <div class="empty-state">Нет описания</div>
            </div>
          </div>

          <!-- TAB: Jira -->
          <div class="epic-tab-panel" :class="{ active: activeEpicTab === 'jira' }">
            <div class="epic-section">
              <div class="epic-section-heading">
                <h3>Задачи Jira</h3>
              </div>
              <div v-for="ticket in (drawerEpic.tickets || [])" :key="ticket.id" class="epic-ticket" @click="openTaskFromEpic(ticket.id)">
                <div class="epic-ticket-icon">JR</div>
                <div class="epic-ticket-body">
                  <div class="epic-ticket-key">{{ ticket.id }}</div>
                  <div class="epic-ticket-title">{{ ticket.title }}</div>
                </div>
                <span class="epic-ticket-status" :class="'epic-ticket-status--' + (ticket.status || '').toLowerCase()">{{ (ticket.status || '').toUpperCase() }}</span>
              </div>
              <div v-if="!drawerEpic.tickets || !drawerEpic.tickets.length" class="empty-state">Нет задач</div>
            </div>
          </div>

          <!-- TAB: History -->
          <div class="epic-tab-panel" :class="{ active: activeEpicTab === 'history' }">
            <div class="epic-section">
              <div class="epic-section-heading">
                <h3>История</h3>
              </div>
              <div class="empty-state">История изменений пока недоступна</div>
            </div>
          </div>
        </div>

        <footer class="epic-drawer-footer">
          <span class="epic-footer-note">
            <a v-if="drawerEpic.confluence_link" :href="drawerEpic.confluence_link" target="_blank" class="epic-link">Confluence &#8599;</a>
          </span>
          <div class="epic-footer-actions">
            <a v-if="drawerEpic.jira_url" :href="drawerEpic.jira_url" target="_blank" class="cmd-btn cmd-btn-cyan">ОТКРЫТЬ В JIRA</a>
          </div>
        </footer>
      </template>

      <!-- ═══ TASK MODE ═══ -->
      <template v-if="drawerMode === 'task'">
        <div class="task-drawer-header">
          <span class="task-drawer-title">
            <span class="text-muted" style="cursor:pointer;margin-right:8px;" @click="backToEpic">&larr;</span>
            {{ drawerTask ? (drawerTask.jira_key || drawerTask.filename || 'TASK') : 'LOADING...' }}
          </span>
          <button class="task-drawer-close" @click="closeDrawer">[&times;]</button>
        </div>

        <div class="task-drawer-body" v-if="drawerTask">
          <div class="task-drawer-section">
            <div class="task-drawer-section-title">INFO</div>
            <div class="task-drawer-meta">
              <span class="task-drawer-meta-label">title:</span>
              <span class="task-drawer-meta-value">{{ drawerTask.title || '—' }}</span>
              <span class="task-drawer-meta-label">date:</span>
              <span class="task-drawer-meta-value">{{ fmtDate(drawerTask.date) || '—' }}</span>
              <span class="task-drawer-meta-label">status:</span>
              <span class="task-drawer-meta-value"><span :class="taskStatusClass">{{ (drawerTask.status || '—').toUpperCase() }}</span></span>
              <span class="task-drawer-meta-label" v-if="drawerTask.type">type:</span>
              <span class="task-drawer-meta-value" v-if="drawerTask.type">{{ drawerTask.type.toUpperCase() }}</span>
              <span class="task-drawer-meta-label" v-if="drawerTask.domain">domain:</span>
              <span class="task-drawer-meta-value text-cyan" v-if="drawerTask.domain">{{ drawerTask.domain.toUpperCase() }}</span>
              <span class="task-drawer-meta-label" v-if="drawerTask.priority">priority:</span>
              <span class="task-drawer-meta-value" v-if="drawerTask.priority">{{ drawerTask.priority.toUpperCase() }}</span>
              <span class="task-drawer-meta-label" v-if="drawerTask.story_points">story_points:</span>
              <span class="task-drawer-meta-value" v-if="drawerTask.story_points">{{ drawerTask.story_points }}</span>
              <span class="task-drawer-meta-label" v-if="drawerTask.jira_key">jira_key:</span>
              <span class="task-drawer-meta-value" v-if="drawerTask.jira_key">{{ drawerTask.jira_key }}</span>
            </div>
          </div>
          <div class="task-drawer-section" v-if="drawerTask.body">
            <div class="task-drawer-section-title">BODY</div>
            <div class="task-drawer-content" v-html="renderMd(drawerTask.body)"></div>
          </div>
          <div class="task-drawer-section">
            <jira-create-section
              :filename="drawerTask.filename || ''"
              :current-type="drawerTask.type || 'Task'"
              :title="drawerTask.title || ''"
              :has-jira-key="!!(drawerTask.jira_key)"
              :jira-key="drawerTask.jira_key || ''"
              :jira-url="drawerTask.jira_url || ''"
              @created="onTaskJiraCreated"
            ></jira-create-section>
          </div>
        </div>

        <div class="task-drawer-body" v-if="!drawerTask" style="display:flex;align-items:center;justify-content:center;">
          <div class="loading">LOADING...</div>
        </div>
      </template>

      <!-- ═══ FALLBACK (no epic, no task, drawer open) ═══ -->
      <template v-if="drawerMode === 'epic' && !drawerEpic">
        <div class="task-drawer-header">
          <span class="task-drawer-title">EPIC</span>
          <button class="task-drawer-close" @click="closeDrawer">[&times;]</button>
        </div>
        <div class="task-drawer-body" style="display:flex;align-items:center;justify-content:center;">
          <div class="loading">LOADING...</div>
        </div>
      </template>

    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script>
    console.log('[roadmap] initializing roadmap page');

    (function() {
      var renderer = new marked.Renderer();
      renderer.link = function(token) {
        var href = token.href || '';
        var title = token.title || '';
        var text = token.text || '';
        var titleAttr = title ? ' title="' + title + '"' : '';
        return '<a href="' + href + '"' + titleAttr + ' target="_blank" rel="noopener">' + text + '</a>';
      };
      marked.use({ breaks: true, gfm: true, renderer: renderer });
      console.log('[roadmap] using marked.js v' + marked.version);
    })();

    var STATUS_COLUMN_MAP = {
      'backlog': 'backlog',
      '': 'backlog',
      'todo': 'todo',
      'open': 'todo',
      'draft': 'todo',
      'in-progress': 'inprogress',
      'in-review': 'inprogress',
      'code-review': 'inprogress',
      'in-testing': 'inprogress',
      'deploy': 'inprogress',
      'staging': 'inprogress',
      'done': 'done',
      'closed': 'done',
      'resolved': 'done',
      'готово': 'done',
      'готово/closed': 'done',
      'development': 'inprogress',
      'ready-for-development': 'todo',
      'в-работе.': 'inprogress',
      'бэклог/идеи': 'backlog'
    };

    function getColumn(epic) {
      var s = (epic.status || '').toLowerCase();
      return STATUS_COLUMN_MAP[s] || 'backlog';
    }

    function fmtDate(d) {
      if (!d) return '';
      var m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[3] + '.' + m[2] + '.' + m[1] : d;
    }

    var app = Vue.createApp({
      setup: function() {
        var epics = Vue.ref([]);
        var loading = Vue.ref(true);
        var error = Vue.ref(null);
        var domains = Vue.ref([]);
        var activeDomain = Vue.ref(null);
        var displayLimit = Vue.ref(50);
        var drawerOpen = Vue.ref(false);
        var drawerMode = Vue.ref('epic');
        var drawerEpic = Vue.ref(null);
        var drawerTask = Vue.ref(null);
        var refreshMode = Vue.ref('auto');
        var refreshInterval = null;
        var searchOpen = Vue.ref(false);
        var activeEpicTab = Vue.ref('overview');

        var taskStatusClass = Vue.computed(function() {
          if (!drawerTask.value) return 'tag tag-muted';
          var s = (drawerTask.value.status || '').toLowerCase();
          if (s === 'done') return 'tag tag-done';
          if (s === 'in-progress') return 'tag tag-jira';
          if (s === 'in-review' || s === 'in-testing' || s === 'code-review') return 'tag tag-prd';
          if (s === 'todo') return 'tag tag-muted';
          if (s === 'cancelled') return 'tag tag-blocked';
          return 'tag tag-muted';
        });

        var backlogEpics = Vue.computed(function() {
          return epics.value.filter(function(e) { return getColumn(e) === 'backlog'; });
        });
        var todoEpics = Vue.computed(function() {
          return epics.value.filter(function(e) { return getColumn(e) === 'todo'; });
        });
        var inprogressEpics = Vue.computed(function() {
          return epics.value.filter(function(e) { return getColumn(e) === 'inprogress'; });
        });
        var doneEpics = Vue.computed(function() {
          return epics.value.filter(function(e) { return getColumn(e) === 'done'; });
        });

        var visibleBacklog = Vue.computed(function() {
          return backlogEpics.value.slice(0, displayLimit.value);
        });
        var visibleTodo = Vue.computed(function() {
          return todoEpics.value.slice(0, displayLimit.value);
        });
        var visibleInprogress = Vue.computed(function() {
          return inprogressEpics.value.slice(0, displayLimit.value);
        });
        var visibleDone = Vue.computed(function() {
          return doneEpics.value.slice(0, displayLimit.value);
        });

        /* Computed: metric counts */
        var totalCount = Vue.computed(function() {
          return epics.value.length;
        });
        var backlogCount = Vue.computed(function() {
          return backlogEpics.value.length;
        });
        var inProgressCount = Vue.computed(function() {
          return inprogressEpics.value.length;
        });
        var doneCount = Vue.computed(function() {
          return doneEpics.value.length;
        });

        /* Methods */
        async function loadEpics() {
          console.log('[roadmap] loadEpics: fetching epics from API, domain=' + (activeDomain.value || 'ALL'));
          loading.value = true;
          error.value = null;
          try {
            var data = await api.epics(activeDomain.value);
            epics.value = data;
            console.log('[roadmap] loadEpics: loaded ' + data.length + ' epics');
            var hlParam = new URLSearchParams(window.location.search).get('highlight');
            if (hlParam) {
              displayLimit.value = 9999;
              Vue.nextTick(function() {
                var el = document.querySelector('[data-filename="' + CSS.escape(hlParam) + '"]');
                console.log('[search] highlight card:', hlParam, el ? 'found' : 'not found');
                if (!el) return;
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight-pulse');
                setTimeout(function() { el.classList.remove('highlight-pulse'); }, 3000);
                history.replaceState(null, '', window.location.pathname + window.location.hash);
              });
            }
          } catch (err) {
            console.error('[roadmap] loadEpics: error', err.message);
            error.value = 'Failed to load epics: ' + err.message;
          } finally {
            loading.value = false;
          }
        }

        async function loadDomains() {
          console.log('[roadmap] loadDomains: fetching domains from API');
          try {
            var data = await api.domains();
            domains.value = data || [];
            console.log('[roadmap] loadDomains: loaded ' + domains.value.length + ' domains');
          } catch (err) {
            console.error('[roadmap] loadDomains error:', err.message);
          }
        }

        function selectDomain(name) {
          console.log('[roadmap] selectDomain:', name || 'ALL');
          activeDomain.value = name;
          loadEpics();
        }

        function showMore() {
          displayLimit.value += 50;
          console.log('[roadmap] showMore — new limit:', displayLimit.value);
        }

        function selectEpicTab(tab) {
          console.log('[roadmap] selectEpicTab:', tab);
          activeEpicTab.value = tab;
        }

        function selectEpic(epic) {
          console.log('[roadmap] selectEpic:', epic.id, epic.title);
          drawerEpic.value = epic;
          drawerTask.value = null;
          drawerMode.value = 'epic';
          activeEpicTab.value = 'overview';
          drawerOpen.value = true;
        }

        async function openTaskFromEpic(jiraKey) {
          console.log('[roadmap] openTaskFromEpic:', jiraKey);
          drawerMode.value = 'task';
          drawerTask.value = null;
          try {
            var data = await api.taskByKey(jiraKey);
            drawerTask.value = data;
            console.log('[roadmap] openTaskFromEpic: loaded task', data.title);
          } catch (err) {
            console.error('[roadmap] openTaskFromEpic: error', err.message);
            drawerTask.value = { title: jiraKey, jira_key: jiraKey, status: 'unknown', body: 'Failed to load: ' + err.message };
          }
        }

        function backToEpic() {
          console.log('[roadmap] backToEpic');
          drawerMode.value = 'epic';
          drawerTask.value = null;
        }

        function renderMd(text) {
          if (!text) return '';
          return marked.parse(text);
        }

        function closeDrawer() {
          console.log('[roadmap] closeDrawer');
          activeEpicTab.value = 'overview';
          drawerOpen.value = false;
          drawerEpic.value = null;
          drawerTask.value = null;
          drawerMode.value = 'epic';
        }

        function onEpicJiraCreated(event) {
          console.log('[roadmap] epic jira created:', event);
          if (drawerEpic.value) {
            drawerEpic.value.jira_key = event.jira_key;
            drawerEpic.value.jira_url = event.jira_url;
          }
          loadEpics();
        }

        function onTaskJiraCreated(event) {
          console.log('[roadmap] task jira created:', event);
          if (drawerTask.value) {
            drawerTask.value.jira_key = event.jira_key;
            drawerTask.value.jira_url = event.jira_url;
          }
        }

        /* Lifecycle */
        Vue.onMounted(function() {
          console.log('[roadmap] onMounted: starting initial load');
          loadDomains();
          loadEpics();
          api.getUserPrefs().then(function(prefs) {
            refreshMode.value = prefs.refresh_mode || 'auto';
            console.log('[roadmap] refresh mode:', refreshMode.value);
            if (refreshMode.value === 'auto') {
              refreshInterval = setInterval(function() {
                console.log('[roadmap] auto-refresh — 60s interval');
                loadEpics();
              }, 60000);
            }
          }).catch(function(err) {
            console.error('[roadmap] getUserPrefs error, defaulting to auto:', err.message);
            refreshInterval = setInterval(function() {
              console.log('[roadmap] auto-refresh — 60s interval (fallback)');
              loadEpics();
            }, 60000);
          });
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
              if (drawerMode.value === 'task' && drawerEpic.value) {
                backToEpic();
              } else {
                closeDrawer();
              }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
              e.preventDefault();
              searchOpen.value = true;
            }
          });
        });

        Vue.onUnmounted(function() {
          if (refreshInterval) {
            clearInterval(refreshInterval);
            console.log('[roadmap] unmounted — cleared refresh interval');
          }
        });

        return {
          searchOpen: searchOpen,
          epics: epics,
          loading: loading,
          error: error,
          refreshMode: refreshMode,
          domains: domains,
          activeDomain: activeDomain,
          displayLimit: displayLimit,
          drawerOpen: drawerOpen,
          drawerMode: drawerMode,
          drawerEpic: drawerEpic,
          drawerTask: drawerTask,
          taskStatusClass: taskStatusClass,
          backlogEpics: backlogEpics,
          todoEpics: todoEpics,
          inprogressEpics: inprogressEpics,
          doneEpics: doneEpics,
          visibleBacklog: visibleBacklog,
          visibleTodo: visibleTodo,
          visibleInprogress: visibleInprogress,
          visibleDone: visibleDone,
          totalCount: totalCount,
          inProgressCount: inProgressCount,
          backlogCount: backlogCount,
          doneCount: doneCount,
          loadEpics: loadEpics,
          loadDomains: loadDomains,
          selectDomain: selectDomain,
          showMore: showMore,
          selectEpic: selectEpic,
          openTaskFromEpic: openTaskFromEpic,
          backToEpic: backToEpic,
          closeDrawer: closeDrawer,
          activeEpicTab: activeEpicTab,
          selectEpicTab: selectEpicTab,
          renderMd: renderMd,
          onEpicJiraCreated: onEpicJiraCreated,
          onTaskJiraCreated: onTaskJiraCreated,
          fmtDate: fmtDate
        };
      }
    });

    registerComponents(app);
    applyPageTheme().then(function() {
      app.mount('#app');
      console.log('[roadmap] app mounted');
    });
  </script>
</body>
</html>
