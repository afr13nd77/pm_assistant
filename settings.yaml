# pm_assistant — runtime configuration
# All values have defaults in shared/settings.py. This file is optional.
# Mounted read-only into containers: ./settings.yaml:/app/settings.yaml:ro

timeouts:
  enrich: 30
  synthesize: 120
  fetch_meetings: 120
  jira_sync: 120
  jira_import: 60
  jira_create: 120
  jira_projects: 30
  jira_epics: 30
  jira_issue_types: 30
  lint: 60
  status: 60
  rebuild_index: 60
  ingest_clippings: 120
  health: 60
  default: 60

cooldowns:
  enrichment_reminder_hours: 24
  health_history_days: 90
  enrichment_cleanup_days: 90

cache_ttl:
  vault_api_seconds: 30
  jira_cache_seconds: 300
  domains_cache_seconds: 60
  openrouter_models_seconds: 3600

rate_limits:
  telegram_messages_per_second: 1
  telegram_retry_after_default: 5
  telegram_max_queue_size: 50

paths:
  db_dir: /data

ports:
  ke_api: 8001

queue:
  max_attempts: 5
  stuck_threshold_seconds: 1800
  process_timeout: 180
  batch_limit: 0

moderator:
  # Основные
  relevance_threshold: 7         # порог скоринга (0-10)
  max_items_per_run: 20          # максимум items за прогон
  report_auto_launch: true       # автозапуск deep research
  report_method: cowork          # "cowork" | "internal"
  idea_auto_create: true         # false = только Telegram без записи
  cooldown_hours: 24             # не обрабатывать ту же новость повторно
  # Agent Loop
  max_retries: 3                 # максимум итераций AgentLoop
  escalation_group: signal_escalation
  quality_threshold: 6           # минимальный quality score
  # Persistent Memory
  memory_db_path: /data/signal_memory.db
  memory_cleanup_days: 180
  trend_detection_lookback_weeks: 4
  trend_spike_threshold: 3
  # Self-Reflection
  dedup_similarity_threshold: 8
  dedup_related_threshold: 6
  completeness_threshold: 6
  domain_auto_correct: true
  # Orchestrator
  report_wait_timeout_minutes: 30
  pending_report_poll_interval: 5
  persist_run_state: true
