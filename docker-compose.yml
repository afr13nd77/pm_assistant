version: "3.9"

services:
  pm-bot:
    build:
      context: .
      dockerfile: pm-bot/Dockerfile
      pull: false
    pull_policy: if_not_present
    container_name: pm-bot
    restart: unless-stopped
    shm_size: '512m'
    ipc: host
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ${VAULT_PATH}:/vault
      - ${TRANSCRIPTS_INBOX}:/transcripts/inbox
      - ./pm-bot/web:/web
      - ./settings.yaml:/app/settings.yaml:ro
      - pm-bot-data:/data
    command: >
      sh -c "python -m http.server 8080 --directory /web &
             python -m app.main"
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
      - VAULT_PATH=/vault
      - PIPELINE_API_URL=http://idea-pipeline:8100
      - JIRA_URL=${JIRA_URL}
      - JIRA_TOKEN=${JIRA_TOKEN}
      - STT_ENABLED=1
      - CT2_FORCE_CPU_ISA=GENERIC
      - KE_API_URL=http://knowledge-engine:8001
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DIGEST_ENABLED=1
      - DIGEST_CONTEXT_SOURCE=auto
      - YANDEX_CALENDAR_USERNAME=${YANDEX_CALENDAR_USERNAME:-}
      - YANDEX_CALENDAR_APP_PASSWORD=${YANDEX_CALENDAR_APP_PASSWORD:-}
      - YANDEX_CALENDAR_TIMEZONE=${YANDEX_CALENDAR_TIMEZONE:-Europe/Moscow}
    depends_on:
      - knowledge-engine
      - idea-pipeline

  knowledge-engine:
    build:
      context: .
      dockerfile: knowledge-engine/Dockerfile
      pull: false
    pull_policy: if_not_present
    container_name: knowledge-engine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH}:/vault
      - ./settings.yaml:/app/settings.yaml:ro
      - ./decay.yaml:/app/decay.yaml:ro
      - ke-data:/data
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
      - VAULT_PATH=/vault
      - JIRA_URL=${JIRA_URL}
      - JIRA_TOKEN=${JIRA_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DIGEST_ENABLED=1
    command: >
      sh -c "python -m knowledge_engine serve &
             python -m knowledge_engine watch &
             python -m knowledge_engine queue-watch"

  ke-cron:
    build:
      context: .
      dockerfile: knowledge-engine/Dockerfile
      pull: false
    pull_policy: if_not_present
    container_name: ke-cron
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH}:/vault
      - ./settings.yaml:/app/settings.yaml:ro
      - ./decay.yaml:/app/decay.yaml:ro
      - ke-data:/data
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
      - VAULT_PATH=/vault
      - JIRA_URL=${JIRA_URL}
      - JIRA_TOKEN=${JIRA_TOKEN}
      - JIRA_SYNC_CRON=${JIRA_SYNC_CRON:-0 */3 * * *}
    entrypoint: >
      sh -c "
        env | grep -E '^(TZ|YANDEX_|CLAUDE_|BOT_|ALLOWED_|VAULT_|JIRA_|OPENROUTER_|PYTHONUNBUFFERED)' >> /etc/environment &&
        echo '0 9 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine synthesize --notify >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-synth &&
        echo '15 * * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine fetch-meetings --notify >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-fetch &&
        echo '*/10 * * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine process-queue >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-process-queue &&
        echo \"$JIRA_SYNC_CRON\"' root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine jira-sync --notify >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-jira &&
        echo '0 1 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine cowork-context >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-cowork &&
        echo '0 2 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine rebuild-index >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-rebuild-index &&
        echo '0 3 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine lint >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-lint &&
        echo '0 4 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine health --save >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-health &&
        echo '0 5 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine decay-recalc >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-decay &&
        echo '30 3 * * * root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -c \"from shared.system_log import cleanup_old; cleanup_old(90)\" >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-syslog-cleanup &&
        echo '55 7 * * 1-5 root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine convert-news-digest >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-convert-news &&
        echo '0 8 * * 1-5 root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine moderate-news --notify >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-moderate &&
        echo '5 8 * * 1-5 root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine research-run --notify >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-research &&
        echo '0 6 * * 1 root set -a; . /etc/environment; set +a; cd /app && /usr/local/bin/python -m knowledge_engine trend-detect --notify >> /var/log/ke-cron.log 2>&1' > /etc/cron.d/ke-trends &&
        chmod 0644 /etc/cron.d/ke-synth /etc/cron.d/ke-fetch /etc/cron.d/ke-process-queue /etc/cron.d/ke-jira /etc/cron.d/ke-cowork /etc/cron.d/ke-rebuild-index /etc/cron.d/ke-lint /etc/cron.d/ke-health /etc/cron.d/ke-decay /etc/cron.d/ke-syslog-cleanup /etc/cron.d/ke-convert-news /etc/cron.d/ke-moderate /etc/cron.d/ke-research /etc/cron.d/ke-trends &&
        touch /var/log/ke-cron.log &&
        cron && tail -f /var/log/ke-cron.log
      "

  idea-pipeline:
    build:
      context: .
      dockerfile: idea-pipeline/Dockerfile
      pull: false
    pull_policy: if_not_present
    container_name: idea-pipeline
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH}:/vault
      - ./settings.yaml:/app/settings.yaml:ro
    ports:
      - "8100:8100"
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
      - VAULT_PATH=/vault
      - PIPELINE_HOST=0.0.0.0
      - PIPELINE_PORT=8100

  langfuse-db:
    image: postgres:15
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse_secret}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse_secret}@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme_langfuse_secret}
      NEXTAUTH_URL: http://localhost:3100
      SALT: ${LANGFUSE_SALT:-changeme_langfuse_salt}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  pm-bot-data:
  ke-data:
  langfuse-db-data:
